<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bill Splitter — Alpine</title>
    <!-- Canonical shared design. Serve from framework-bench/ root so this resolves. -->
    <link rel="stylesheet" href="../../shared/styles.css" />
    <script>
      // Shared/global state via Alpine.store — Alpine's cross-component primitive.
      document.addEventListener("alpine:init", () => {
        Alpine.store("settings", {
          theme: "light",
          roundUp: false,
          toggleTheme() {
            this.theme = this.theme === "dark" ? "light" : "dark";
          },
          toggleRoundUp() {
            this.roundUp = !this.roundUp;
          },
        });
      });
      const _usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
      window.fmt = (v) => _usd.format(v);
      window.parseNum = (s) => {
        const v = parseFloat(s);
        return Number.isFinite(v) && v >= 0 ? v : 0;
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  </head>
  <body>
    <main
      class="bs-app"
      :data-theme="$store.settings.theme"
      x-data="{
        bill: 0, tip: 18, people: 1, presets: [10,15,18,20,25],
        get tipAmount() { return this.bill * this.tip / 100 },
        get total() { return this.bill + this.tipAmount },
        get perPersonRaw() { return this.people > 0 ? this.total / this.people : 0 },
        get perPerson() { return this.$store.settings.roundUp ? Math.ceil(this.perPersonRaw) : this.perPersonRaw },
        get totalCollected() { return this.$store.settings.roundUp ? this.perPerson * this.people : this.total },
        get roundingExtra() { return Math.max(0, this.totalCollected - this.total) },
        get effTip() { return this.bill > 0 ? (this.totalCollected - this.bill) / this.bill * 100 : this.tip }
      }"
    >
      <header class="bs-header">
        <h1 class="bs-title">Bill Splitter</h1>
        <div class="bs-header-actions">
          <button class="bs-toggle" :aria-pressed="$store.settings.roundUp" @click="$store.settings.toggleRoundUp()">
            Round up
          </button>
          <button
            class="bs-toggle"
            :aria-pressed="$store.settings.theme === 'dark'"
            @click="$store.settings.toggleTheme()"
          >
            Dark
          </button>
        </div>
      </header>

      <section class="bs-card bs-inputs">
        <label class="bs-field">
          <span class="bs-label">Bill amount</span>
          <div class="bs-input-wrap">
            <span class="bs-prefix">$</span>
            <input
              class="bs-input"
              type="number"
              min="0"
              step="0.01"
              :value="bill || ''"
              @input="bill = parseNum($event.target.value)"
            />
          </div>
        </label>

        <div class="bs-field">
          <span class="bs-label">Tip</span>
          <div class="bs-presets">
            <template x-for="p in presets" :key="p">
              <button class="bs-preset" :class="{ 'bs-preset--active': tip === p }" @click="tip = p" x-text="p + '%'"></button>
            </template>
            <input
              class="bs-preset-custom"
              type="number"
              min="0"
              placeholder="Custom %"
              :value="tip || ''"
              @input="tip = parseNum($event.target.value)"
            />
          </div>
        </div>

        <div class="bs-field">
          <span class="bs-label">People</span>
          <div class="bs-stepper">
            <button class="bs-step" aria-label="Fewer people" :disabled="people <= 1" @click="people = Math.max(1, people - 1)">
              −
            </button>
            <span class="bs-count" x-text="people"></span>
            <button class="bs-step" aria-label="More people" @click="people = people + 1">+</button>
          </div>
        </div>
      </section>

      <section class="bs-card bs-results">
        <div class="bs-result-row"><span>Tip</span><span x-text="fmt(tipAmount)"></span></div>
        <div class="bs-result-row"><span>Total</span><span x-text="fmt(total)"></span></div>
        <div class="bs-result-hero">
          <span class="bs-result-hero-label">Per person</span>
          <span class="bs-result-hero-value" x-text="fmt(perPerson)"></span>
        </div>
        <p
          class="bs-note"
          x-show="$store.settings.roundUp && roundingExtra > 0"
          x-text="`Rounding up collects ${fmt(roundingExtra)} extra · effective tip ${effTip.toFixed(1)}%`"
        ></p>
        <p class="bs-empty" x-show="bill <= 0">Enter a bill amount to begin.</p>
      </section>

      <section class="bs-card bs-breakdown">
        <h2 class="bs-subtitle">Per-person breakdown</h2>
        <ul class="bs-people">
          <template x-for="n in people" :key="n">
            <li class="bs-person"><span x-text="'Person ' + n"></span><span x-text="fmt(perPerson)"></span></li>
          </template>
        </ul>
      </section>

      <footer
        class="bs-footer"
        x-text="`Splitting ${fmt(total)} between ${people} · ${$store.settings.theme} theme`"
      ></footer>
    </main>
  </body>
</html>
