name: CI + Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver tag to release (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # Wails' generated fixtures exceed Windows' legacy path limit.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Build Generated Test Assets
        run: |
          New-Item -ItemType Directory -Force -Path examples/static/bin | Out-Null
          $env:GOOS = "js"
          $env:GOARCH = "wasm"
          go build -o examples/static/bin/atlas-commerce-os.wasm ./examples/server/atlas-commerce-os/client
          if ($LASTEXITCODE -ne 0) { throw "Atlas wasm build failed" }
          go build -tags production -o examples/testing/v5-load-harness/v5harness.wasm ./examples/testing/v5-load-harness
          if ($LASTEXITCODE -ne 0) { throw "v5 load-harness wasm build failed" }
          Remove-Item Env:\GOOS, Env:\GOARCH
        shell: pwsh

      - name: Run Go Unit Tests
        run: |
          go test -short -v -count=1 ./...
        shell: pwsh

      - name: Reproducible-Build Gate
        # E2: the byte-identical reproducibility check is skipped under -short (it does two full
        # wasm builds), so run it explicitly on the release path — provenance attestation is only
        # meaningful if builds are actually reproducible. Not -short, scoped to the one package.
        run: |
          go test -run TestReproducibleWasmBuild -count=1 ./tools/reprobuild
        shell: pwsh

      - name: Vulnerability Scan (govulncheck)
        # Surfaces known vulnerabilities in the root module's call graph.
        # This gate is blocking. Any accepted exception must be documented in
        # security/govulncheck-suppressions.md and should have a tracked expiry.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          & "$(go env GOPATH)\bin\govulncheck.exe" ./...
        shell: pwsh

      - name: Generate CycloneDX SBOM
        # Emits a dependency SBOM whose component list is derived from the
        # resolved module graph (go list -m -json all), attachable to the release.
        run: |
          go run ./tools/sbom/cmd/sbom bin/sbom.cyclonedx.json
        shell: pwsh

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v6
        with:
          name: cyclonedx-sbom
          path: bin/sbom.cyclonedx.json
          if-no-files-found: error

      - name: CHANGELOG Entry Check
        # Verifies the tag being released has a CHANGELOG.md section. This is a
        # blocking release gate so tags do not ship with generated notes only.
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.release_tag }}" } else { $env:GITHUB_REF_NAME }
          go run ./tools/changelogcheck/cmd/changelogcheck CHANGELOG.md $tag
        shell: pwsh

      - name: Run Golden-Path Verify Audit
        run: |
          go run ./tools/gwc verify -app .\examples\public\counter\main.go -root .\examples\public\counter -skip-tests -audit -audit-min-severity error
        shell: pwsh

      - name: Run Browser Smoke Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestMainSuite -v
        shell: pwsh

      - name: Run Browser Benchmark Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestBenchmark -v
        shell: pwsh

      - name: Run Canonical Go Get Smoke (Release Guard)
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $parseCandidateRoot = $PWD.Path
          $workDir = Join-Path $env:TEMP ("gwc-release-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $workDir | Out-Null
          try {
            Push-Location $workDir
            go mod init example.com/gwc-release-smoke
            if ($LASTEXITCODE -ne 0) { throw "go mod init failed" }
            # Write a tiny external consumer that imports the released module, so the
            # smoke proves import-path resolution and a real consumer compile.
            # Tag pushes resolve exactly that tag, never a previous @latest.
            # Manual releases have no tag yet, so validate the checked-out candidate.
            $main = @(
              'package main',
              'import "github.com/monstercameron/GoWebComponents/v6/ui"',
              'var _ = ui.Text("release-smoke")',
              'func main() {}'
            ) -join "`n"
            Set-Content -Path (Join-Path $workDir "main.go") -Value $main -Encoding utf8
            if ($env:RELEASE_EVENT -eq 'workflow_dispatch') {
              go mod edit "-require=github.com/monstercameron/GoWebComponents/v6@$($env:RELEASE_TAG)" "-replace=github.com/monstercameron/GoWebComponents/v6=$parseCandidateRoot"
              if ($LASTEXITCODE -ne 0) { throw 'Configure candidate consumer failed' }
            } else {
              go get "github.com/monstercameron/GoWebComponents/v6@$($env:RELEASE_TAG)"
              if ($LASTEXITCODE -ne 0) { throw 'Fetch exact release candidate failed' }
            }
            # Populate go.sum for the full transitive closure so the consumer build resolves every
            # dependency (go get of the module alone does not add transitive deps' go.sum entries).
            go mod tidy
            if ($LASTEXITCODE -ne 0) { throw "go mod tidy of consumer failed" }
            go build ./...
            if ($LASTEXITCODE -ne 0) { throw "native consumer build failed" }
            $env:GOOS = "js"; $env:GOARCH = "wasm"
            go build ./...
            $wasmExit = $LASTEXITCODE
            Remove-Item Env:GOOS; Remove-Item Env:GOARCH
            if ($wasmExit -ne 0) { throw "wasm consumer build failed" }
          } finally {
            Pop-Location
            if (Test-Path $workDir) {
              Remove-Item -Recurse -Force $workDir
            }
          }
        shell: pwsh

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ github.event.inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@v6
        with:
          name: cyclonedx-sbom
          path: release-assets

      - name: Create Tag For Manual Release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$GITHUB_SHA" ]; then
              echo "Existing tag does not identify the verified candidate. Refusing release."
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Build Release Archive
        id: archive
        shell: bash
        run: |
          release_tag="${{ steps.tag.outputs.release_tag }}"
          archive_name="GoWebComponents-${release_tag}.tar.gz"
          git archive --format=tar.gz --output "${archive_name}" "${release_tag}"
          sha256sum "${archive_name}" > "${archive_name}.sha256"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Build Prebuilt gwc Binaries
        # A2: ship a prebuilt `gwc` for every supported platform so users skip a from-source
        # build. gwc is a pure-Go CLI, so it cross-compiles with CGO disabled; each binary is
        # checksummed into a single SHA256SUMS manifest attached to the release.
        shell: bash
        run: |
          mkdir -p dist
          release_tag="${{ steps.tag.outputs.release_tag }}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="gwc_${release_tag}_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/${out}${ext}" ./tools/gwc
          done
          ( cd dist && sha256sum gwc_* > SHA256SUMS )
          ls -l dist

      - name: Generate gwc Binary Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/gwc_*

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.archive_name }}.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          files: |
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.archive_name }}.sha256
            release-assets/sbom.cyclonedx.json
            dist/gwc_*
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Release ${{ steps.tag.outputs.release_tag }}

            Changes in this release:
            - Release tag explicitly selected (no auto patch increment on main)
            - Passed the configured release workflow gates; see CHANGELOG.md for verification scope and known limitations
            - Includes source archive with SHA-256 checksum
            - Prebuilt `gwc` binaries for linux/macOS/windows (amd64 + arm64) with SHA256SUMS
            - Includes GitHub build provenance attestation (source + binaries)
          draft: false
          prerelease: false
