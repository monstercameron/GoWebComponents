name: CI + Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver tag to release (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Run Go Unit Tests
        run: |
          go test -v -count=1 ./...
        shell: pwsh

      - name: Vulnerability Scan (govulncheck)
        # Surfaces known vulnerabilities in the root module's call graph.
        # This gate is blocking. Any accepted exception must be documented in
        # security/govulncheck-suppressions.md and should have a tracked expiry.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          & "$(go env GOPATH)\bin\govulncheck.exe" ./...
        shell: pwsh

      - name: Generate CycloneDX SBOM
        # Emits a dependency SBOM whose component list is derived from the
        # resolved module graph (go list -m -json all), attachable to the release.
        run: |
          go run ./tools/sbom/cmd/sbom bin/sbom.cyclonedx.json
        shell: pwsh

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v6
        with:
          name: cyclonedx-sbom
          path: bin/sbom.cyclonedx.json
          if-no-files-found: error

      - name: CHANGELOG Entry Check
        # Verifies the tag being released has a CHANGELOG.md section. This is a
        # blocking release gate so tags do not ship with generated notes only.
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.release_tag }}" }
          go run ./tools/changelogcheck/cmd/changelogcheck CHANGELOG.md $tag
        shell: pwsh

      - name: Run Golden-Path Verify Audit
        run: |
          go run ./tools/gwc verify -app .\examples\public\counter\main.go -root .\examples\public\counter -skip-tests -audit -audit-min-severity error
        shell: pwsh

      - name: Run Browser Smoke Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestMainSuite -v
        shell: pwsh

      - name: Run Browser Benchmark Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestBenchmark -v
        shell: pwsh

      - name: Run Canonical Go Get Smoke (Release Guard)
        run: |
          $ErrorActionPreference = "Stop"
          $workDir = Join-Path $env:TEMP ("gogrpcbridge-release-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $workDir | Out-Null
          try {
            Push-Location $workDir
            go mod init example.com/gogrpcbridge-release-smoke
            if ($LASTEXITCODE -ne 0) { throw "go mod init failed" }
            go get github.com/monstercameron/grpc-tunnel@latest
            if ($LASTEXITCODE -ne 0) { throw "canonical go-get smoke failed" }
          } finally {
            Pop-Location
            if (Test-Path $workDir) {
              Remove-Item -Recurse -Force $workDir
            }
          }
        shell: pwsh

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ github.event.inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@v6
        with:
          name: cyclonedx-sbom
          path: release-assets

      - name: Create Tag For Manual Release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Build Release Archive
        id: archive
        shell: bash
        run: |
          release_tag="${{ steps.tag.outputs.release_tag }}"
          archive_name="GoWebComponents-${release_tag}.tar.gz"
          git archive --format=tar.gz --output "${archive_name}" "${release_tag}"
          sha256sum "${archive_name}" > "${archive_name}.sha256"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.archive_name }}.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          files: |
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.archive_name }}.sha256
            release-assets/sbom.cyclonedx.json
          generate_release_notes: true
          body: |
            Release ${{ steps.tag.outputs.release_tag }}

            Changes in this release:
            - Release tag explicitly selected (no auto patch increment on main)
            - Passed unit/e2e and release verification gates
            - Includes source archive with SHA-256 checksum
            - Includes GitHub build provenance attestation
          draft: false
          prerelease: false
