name: CI + Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Warn when push-based auto release is disabled
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ vars.GWC_ENABLE_AUTO_RELEASE }}" != "true" ]; then
            echo "::warning::Push-triggered release is disabled. Set repo variable GWC_ENABLE_AUTO_RELEASE=true or run workflow_dispatch."
          fi

  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Run Go Unit Tests
        run: |
          go test -v -count=1 ./...
        shell: pwsh

      - name: Run Golden-Path Verify Audit
        run: |
          go run ./tools/gwc verify -app .\examples\01-counter\main.go -root .\examples\01-counter -skip-tests -audit -audit-min-severity error
        shell: pwsh

      - name: Run Browser Smoke Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestMainSuite -v
        shell: pwsh

      - name: Run Browser Benchmark Suite (Playwright-Go)
        run: |
          go test -tags playwrightgo ./test/playwrightgo -run TestBenchmark -v
        shell: pwsh

  release:
    needs:
      - release-guard
      - build-and-test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'workflow_dispatch' || vars.GWC_ENABLE_AUTO_RELEASE == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          echo "Latest tag: $latest_tag"

          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_tag="v${major}.${minor}.${patch}"
          
          echo "New tag: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create Tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists. Skipping."
            exit 0
          fi
          
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: |
            Automated release ${{ steps.version.outputs.new_tag }}
            
            Changes in this release:
            - Auto-incremented version
            - Passed all unit and E2E tests
          draft: false
          prerelease: false
