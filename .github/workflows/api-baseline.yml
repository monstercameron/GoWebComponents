name: API Baseline

# Public-API merge gate: runs on every PR (and push to main) so an accidental
# breaking change to an exported surface fails BEFORE merge — not only at
# release tag time. Regenerate intentional changes with:
#   go -C tools run ./api_compat_guard --module-root=.. -update

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Public-API compatibility guard (native + wasm)
        # Compares exported funcs/types/signatures against
        # tools/api_compat_guard/api_compatibility_baseline.json on native and js/wasm.
        # Intentional changes regenerate it with: go -C tools run ./api_compat_guard --module-root=.. -update
        run: go -C tools run ./api_compat_guard --module-root=..
