name: Deploy Examples To Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Example WASM Files
        shell: pwsh
        run: |
          go run ./tools/gwc examples build-public-site -profile ci

      - name: Prepare Pages Artifact
        shell: pwsh
        run: |
          $pagesDir = Join-Path $PWD '.pages'
          $examplesDir = Join-Path $PWD 'examples'
          $pagesExampleDirs = @('public-examples-site', 'static')

          if (Test-Path $pagesDir) {
            Remove-Item $pagesDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $pagesDir | Out-Null
          foreach ($exampleDir in $pagesExampleDirs) {
            Copy-Item (Join-Path $examplesDir $exampleDir) $pagesDir -Recurse -Force
          }

          New-Item -ItemType File -Path (Join-Path $pagesDir '.nojekyll') | Out-Null

      - name: Generate Static Docs Site
        shell: pwsh
        run: |
          go run ./tools/sitegen -root . -out .pages
          if ($LASTEXITCODE -ne 0) { throw "sitegen failed" }

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
