name: Deploy Examples To Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Example WASM Files
        shell: pwsh
        run: |
          go run ./tools/gwc examples build-public-site -profile ci

      - name: Prepare Pages Artifact
        shell: pwsh
        run: |
          $pagesDir = Join-Path $PWD '.pages'
          $examplesDir = Join-Path $PWD 'examples'
          $pagesExampleDirs = @('public-examples-site', 'static')

          if (Test-Path $pagesDir) {
            Remove-Item $pagesDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $pagesDir | Out-Null
          foreach ($exampleDir in $pagesExampleDirs) {
            Copy-Item (Join-Path $examplesDir $exampleDir) $pagesDir -Recurse -Force
          }

          @'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./public-examples-site/index.html">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>GoWebComponents Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="./public-examples-site/index.html">the docs site</a>...</p>
            </body>
          </html>
          '@ | Set-Content -Path (Join-Path $pagesDir 'index.html')

          New-Item -ItemType File -Path (Join-Path $pagesDir '.nojekyll') | Out-Null

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
