name: Deploy Examples To Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/static/package-lock.json

      - name: Install Static Asset Dependencies
        working-directory: ./examples/static
        shell: pwsh
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Example WASM Files
        shell: pwsh
        run: ./examples/build.ps1

      - name: Prepare Pages Artifact
        shell: pwsh
        run: |
          $pagesDir = Join-Path $PWD '.pages'
          $builtExamplesDir = Join-Path $PWD 'bin\examples'
          $pagesStaticBinDir = Join-Path $pagesDir 'static\bin'
          $embeddedBinsDir = Join-Path $pagesDir '00-example-0\assets\bins'

          if (Test-Path $pagesDir) {
            Remove-Item $pagesDir -Recurse -Force
          }

          if (-not (Test-Path $builtExamplesDir)) {
            throw "Built example binaries were not found at $builtExamplesDir"
          }

          New-Item -ItemType Directory -Path $pagesDir | Out-Null
          Copy-Item examples\* $pagesDir -Recurse -Force
          New-Item -ItemType Directory -Path $pagesStaticBinDir -Force | Out-Null
          Get-ChildItem -Path $builtExamplesDir -Filter '*.wasm' | Copy-Item -Destination $pagesStaticBinDir -Force

          foreach ($requiredBinary in @('example-0.wasm', 'counter.wasm')) {
            $requiredPath = Join-Path $pagesStaticBinDir $requiredBinary
            if (-not (Test-Path $requiredPath)) {
              throw "Required Pages binary missing after staging: $requiredPath"
            }
          }

          New-Item -ItemType Directory -Path $embeddedBinsDir -Force | Out-Null
          Copy-Item (Join-Path $builtExamplesDir 'counter.wasm') (Join-Path $embeddedBinsDir '01-counter.wasm') -Force

          @'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./static/index.html">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>GoWebComponents Examples</title>
            </head>
            <body>
              <p>Redirecting to <a href="./static/index.html">the examples showcase</a>...</p>
            </body>
          </html>
          '@ | Set-Content -Path (Join-Path $pagesDir 'index.html')

          New-Item -ItemType File -Path (Join-Path $pagesDir '.nojekyll') | Out-Null

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4