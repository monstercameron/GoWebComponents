name: Browser Compatibility

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/package-lock.json

      - name: Install Example Test Dependencies
        working-directory: ./examples
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./examples
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Browser Compatibility Smoke
        working-directory: ./examples
        run: npm run test:browser-compat
        env:
          CI: true
