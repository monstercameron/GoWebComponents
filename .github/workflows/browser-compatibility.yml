name: Browser Compatibility

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Run Browser Compatibility Smoke (Playwright-Go)
        run: |
          go -C test/playwrightgo test -tags playwrightgo ./examples -run TestBrowserCompat -v

      - name: Run Main Browser Suite (Playwright-Go)
        run: |
          go -C test/playwrightgo test -tags playwrightgo . -run '^TestMainSuite$' -count=1 -v

      - name: Run Examples Browser Suite (Playwright-Go)
        run: |
          go -C test/playwrightgo test -tags playwrightgo ./examples -run '^TestExamplesAll$' -count=1 -v
