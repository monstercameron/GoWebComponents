name: No Tracked Binaries

on:
  pull_request:
  push:
    branches: [main, v7/dev]

permissions:
  contents: read

jobs:
  no-tracked-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Fail on tracked binaries
        run: |
          go -C tools test ./binarycheck/...
          go -C tools run ./binarycheck/cmd/binarycheck
