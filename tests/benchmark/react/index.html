<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>React Benchmark</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useMemo, createElement } = React;

        function DeepTree({ depth }) {
            if (depth <= 0) {
                return createElement("div", { className: "leaf", id: "deep-leaf" }, "Leaf");
            }
            return createElement("div", { className: "node" }, createElement(DeepTree, { depth: depth - 1 }));
        }

        function ManyHooks() {
            for (let i = 0; i < 50; i++) {
                useState(i);
                useEffect(() => {}, []);
                useMemo(() => i * 2, [i]);
            }
            return createElement("div", { className: "hook-node" }, "Hooks");
        }

        function BenchmarkApp() {
            const [items, setItems] = useState([]);
            const [view, setView] = useState("list"); // list, deep, hooks
            const [lastRenderTime, setLastRenderTime] = useState("");
            const [computeResult, setComputeResult] = useState("");

            useEffect(() => {
                setLastRenderTime(new Date().toISOString());
            }, [items, view]);

            const computePrimes = () => {
                const start = performance.now();
                let count = 0;
                for (let i = 2; i < 200000; i++) {
                    let isPrime = true;
                    for (let j = 2; j * j <= i; j++) {
                        if (i % j === 0) {
                            isPrime = false;
                            break;
                        }
                    }
                    if (isPrime) {
                        count++;
                    }
                }
                const duration = performance.now() - start;
                setComputeResult(`Found ${count} primes in ${Math.round(duration)}ms`);
            };

            const renderList = () => {
                setView("list");
                const newItems = [];
                for (let i = 0; i < 1000; i++) {
                    newItems.push("Item " + i);
                }
                setItems(newItems);
            };

            const renderDeep = () => {
                setView("deep");
                setItems([]);
            };

            const renderHooks = () => {
                setView("hooks");
                setItems([]);
            };

            const clearList = () => {
                setView("list");
                setItems([]);
            };

            const updateList = () => {
                setItems(prev => prev.map(item => item + " (Updated)"));
            };

            let content;
            if (view === "deep") {
                content = createElement(DeepTree, { depth: 100 });
            } else if (view === "hooks") {
                const children = [];
                for (let i = 0; i < 100; i++) {
                    children.push(createElement(ManyHooks, { key: i }));
                }
                content = createElement("div", { id: "hooks-container" }, children);
            } else {
                content = createElement("div", { id: "list-container" },
                    items.map((item, index) => 
                        createElement("div", { key: index, className: "list-item" }, item)
                    )
                );
            }

            return createElement("div", { id: "app" },
                createElement("h1", null, "Benchmark App (React)"),
                createElement("div", { id: "controls" },
                    createElement("button", { id: "btn-render", onClick: renderList }, "Render 1000 Items"),
                    createElement("button", { id: "btn-update", onClick: updateList }, "Update Items"),
                    createElement("button", { id: "btn-clear", onClick: clearList }, "Clear List"),
                    createElement("button", { id: "btn-deep", onClick: renderDeep }, "Render Deep Tree (500)"),
                    createElement("button", { id: "btn-hooks", onClick: renderHooks }, "Render 100 Components w/ 150 Hooks"),
                    createElement("button", { id: "btn-compute", onClick: computePrimes }, "Compute Primes (200k)")
                ),
                createElement("div", { id: "metrics" },
                    createElement("p", { id: "last-render" }, "Last Render: " + lastRenderTime),
                    createElement("p", { id: "item-count" }, "Count: " + items.length),
                    createElement("p", { id: "compute-result" }, computeResult)
                ),
                createElement("div", { id: "container" }, content)
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(createElement(BenchmarkApp));
    </script>
</body>
</html>
