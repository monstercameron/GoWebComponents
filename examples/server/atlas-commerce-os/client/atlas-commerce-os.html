<!DOCTYPE html>
<html lang="en" class="atlas-theme-dark atlas-density-compact">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Commerce OS - GoWebComponents</title>
    <!--
        NO EXTERNAL STYLESHEET, AND NO .atlas-* VISUAL SYSTEM.

        This page used to link ../../../static/css/tailwind.css plus
        ../../../static/css/example-shell.css and then carry ~630 lines of inline CSS
        defining a parallel .atlas-* look (near-black gradient panels, teal/orange/
        yellow accents, rounded pills). All of it was scoped to `body.atlas-shell`
        while the SERVER emits a <body> with no such class, so the entire system was
        inert on every served page - two visual languages for one app, one of which
        only ever appeared on this file. That is the exact failure a design system
        exists to prevent, so it is gone; both lanes now render from shared/design.

        The Go client calls design.Install() at boot (bootAtlasClient in main.go),
        which emits the reset, the :root token block, the prefers-color-scheme dark
        override, the element baseline, the a11y floor and the print layer. On a
        served page the server has already inlined that same layer as
        <style data-gwc-css> and the client seeds from it instead of re-emitting;
        here there is no server, so the client's own emission is the only source.
        Either way there is exactly one.

        WHAT IS STILL INLINE BELOW, AND WHY IT HAS TO BE: these rules style the
        pre-hydration placeholder, which is on screen precisely BECAUSE the wasm
        module has not run yet. CSS authored in Go cannot style the window before Go
        starts. That is the whole exception, and it is why it is this small.
    -->
    <style>
        /* Matches design.Install()'s declaration exactly. `light dark` says both
           schemes are supported, so the UA paints its canvas, scrollbars and form
           controls to the visitor's preference. It is NOT `color-scheme: dark` - that
           hard lock, plus three !important gradients, is what made the old
           example-shell.css unfightable and left the app rendering near-black while
           reporting THEME: light. */
        html { color-scheme: light dark; }

        /* The route announcer must be reachable by a screen reader and invisible to
           everyone else. It ships in the markup below, before any Go has run. */
        .atlas-visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /*
            Pre-hydration placeholder motion.

            Duplicated from atlasBootSurfaceCSS in client/bootsurface.go on purpose:
            that copy is injected by the Go client, which by definition has not run
            yet while this placeholder is the only thing on screen. Two definitions
            because they cover two different windows, not by oversight.
        */
        @keyframes atlas-boot-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        [data-atlas-boot-skeleton] .atlas-boot-bar {
            animation: atlas-boot-pulse 1.4s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            [data-atlas-boot-skeleton] .atlas-boot-bar {
                animation: none;
                opacity: 0.6;
            }
        }
    </style>
    <script src="../../../static/script/wasm_exec.js"></script>
</head>
<body>
    <div id="atlas-route-announcer" class="atlas-visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <!--
        Pre-hydration placeholder.

        NOTHING renders inside #app until the client wasm (~19 MB) has downloaded and
        instantiated — measured at ~1.3 s on localhost, and every pixel of Atlas is
        client-rendered. Without this block the page is blank for that entire window,
        which is indistinguishable from the blank page a boot failure produces. That
        ambiguity is the point: a deliberate loading state is also a diagnostic, because
        it makes "still loading" and "broken" look different.

        It sits OUTSIDE #app on purpose. Placeholder markup inside the mount point would
        be diffed against the client tree during hydration and reported as a mismatch.
        The client removes this node once it owns the screen (clearAtlasBootPlaceholder
        in client/bootsurface.go, keyed on data-atlas-boot-skeleton), so the teardown
        lives with the code that knows hydration actually finished.
    -->
    <div id="atlas-boot-placeholder" data-atlas-boot-skeleton="true" role="status" aria-live="polite" aria-busy="true"
         style="max-width:52rem;margin:0 auto;padding:2.5rem 1.25rem;">
        <p style="margin:0 0 1.25rem 0;font-size:0.78rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;opacity:0.7;">Loading Atlas…</p>
        <div class="atlas-boot-bar" style="width:38%;height:1.75rem;margin-bottom:0.75rem;border-radius:0.5rem;background:currentColor;opacity:0.5;"></div>
        <div class="atlas-boot-bar" style="width:68%;height:0.9rem;margin-bottom:0.75rem;border-radius:0.5rem;background:currentColor;opacity:0.5;"></div>
        <div class="atlas-boot-bar" style="width:54%;height:0.9rem;margin-bottom:0.75rem;border-radius:0.5rem;background:currentColor;opacity:0.5;"></div>
        <div class="atlas-boot-bar" style="width:100%;height:9rem;border-radius:0.5rem;background:currentColor;opacity:0.5;"></div>
    </div>
    <div id="app"></div>
    <!-- Atlas overlay and portal host: secondary UI must render here rather than inside #app. -->
    <div id="atlas-overlay-root" data-atlas-portal-host="overlays"></div>
    <script>
        // Boot the client, and report a boot that does not happen.
        //
        // The previous version of this snippet ended at
        // `.catch(err => console.error('Failed to load WASM:', err))`. A 404 on the
        // wasm, a MIME type the browser refuses to stream, or a corrupt build all
        // landed there — which means the page stayed blank and the only evidence was
        // one console line. Both failure paths below therefore write to the DOM.
        //
        // window.__atlasSurfaceFailure is installed by the Go client itself
        // (installAtlasBootSurface), so it does NOT exist yet at this point: if the
        // wasm never loads, neither does the surface. Hence the local fallback.
        (function () {
            function reportBootFailure(kind, headline, detail, technical) {
                if (typeof window.__atlasSurfaceFailure === 'function') {
                    window.__atlasSurfaceFailure({
                        mode: 'fatal', kind: kind, headline: headline,
                        detail: detail, technical: technical
                    });
                    return;
                }
                var host = document.getElementById('app') || document.body;
                var panel = document.createElement('pre');
                panel.setAttribute('data-atlas-boot-failure', 'bootstrap');
                panel.setAttribute('role', 'alert');
                panel.setAttribute('style', 'max-width:52rem;margin:2rem auto;padding:1.25rem;' +
                    'border:1px solid #b4534f;border-left-width:6px;border-radius:0.75rem;' +
                    'background:#2b1113;color:#fdeaea;white-space:pre-wrap;word-break:break-word;');
                // textContent, never innerHTML: `technical` can carry a URL or a
                // server message, i.e. content this page does not control.
                panel.textContent = headline + '\n\n' + detail + '\n\n' + technical;
                host.textContent = '';
                host.appendChild(panel);
                document.documentElement.setAttribute('data-atlas-boot-state', 'failed');
                var skeleton = document.getElementById('atlas-boot-placeholder');
                if (skeleton && skeleton.parentNode) { skeleton.parentNode.removeChild(skeleton); }
            }

            var go = new Go();

            // wasm_exec.js's default `exit` hook is
            // `code => { if (code !== 0) console.warn("exit code:", code); }` — a
            // console line and nothing more. It is an instance property precisely so
            // an embedder can replace it, so capture the code and keep the original
            // behaviour. A Go panic arrives here as code 2.
            var exitCode = null;
            var defaultExit = go.exit.bind(go);
            go.exit = function (code) { exitCode = code; defaultExit(code); };

            WebAssembly.instantiateStreaming(fetch('../../../static/bin/atlas-commerce-os.wasm'), go.importObject)
                .then(function (result) {
                    // go.run resolves when the Go program EXITS. Atlas parks in
                    // select{} and never exits on purpose, so resolving here means
                    // the runtime stopped — a panic (exit 2) or an early return.
                    // wasm_exec.js reports that as console.warn("exit code:", 2) and
                    // nothing else, which is why a panicked Atlas looks frozen
                    // rather than broken.
                    return go.run(result.instance).then(function () {
                        reportBootFailure('runtime-exit', 'Atlas stopped running',
                            'The Go runtime exited, so nothing on this page will respond any more. The panic trace is in the console.',
                            'go.run resolved; exit code ' + exitCode);
                    });
                })
                .catch(function (err) {
                    reportBootFailure('wasm-load', 'Atlas could not load its client',
                        'The browser could not download or instantiate atlas-commerce-os.wasm. Build it with: GOOS=js GOARCH=wasm go build -o examples/static/bin/atlas-commerce-os.wasm ./examples/server/atlas-commerce-os/client',
                        String(err));
                });
        }());
    </script>
</body>
</html>
