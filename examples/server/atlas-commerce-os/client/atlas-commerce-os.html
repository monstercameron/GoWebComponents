<!DOCTYPE html>
<html lang="en" class="atlas-theme-dark atlas-density-compact">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Commerce OS - GoWebComponents</title>
    <link rel="stylesheet" href="../../../static/css/tailwind.css">
    <link rel="stylesheet" href="../../../static/css/example-shell.css">
    <style>
        :root {
            --atlas-bg: linear-gradient(180deg, #07111c 0%, #0c1726 38%, #111827 100%);
            --atlas-spot-a: rgba(45, 212, 191, 0.18);
            --atlas-spot-b: rgba(251, 146, 60, 0.16);
            --atlas-spot-c: rgba(125, 211, 252, 0.1);
            --atlas-panel: linear-gradient(145deg, rgba(15, 23, 42, 0.86), rgba(15, 23, 42, 0.7));
            --atlas-panel-strong: linear-gradient(140deg, rgba(13, 21, 38, 0.96), rgba(21, 33, 56, 0.88));
            --atlas-panel-accent: linear-gradient(145deg, rgba(22, 78, 99, 0.38), rgba(30, 41, 59, 0.74));
            --atlas-subtle: rgba(15, 23, 42, 0.52);
            --atlas-chip: rgba(15, 23, 42, 0.44);
            --atlas-chip-hover: rgba(30, 41, 59, 0.58);
            --atlas-stat: rgba(15, 23, 42, 0.6);
            --atlas-code: rgba(2, 6, 23, 0.72);
            --atlas-line: rgba(148, 163, 184, 0.18);
            --atlas-line-strong: rgba(148, 163, 184, 0.28);
            --atlas-heading: #f8fbff;
            --atlas-copy: #d5dfec;
            --atlas-muted: #90a4bf;
            --atlas-muted-strong: #dbe7f5;
            --atlas-accent: #7dd3fc;
            --atlas-accent-soft: rgba(125, 211, 252, 0.16);
            --atlas-accent-line: rgba(56, 189, 248, 0.44);
            --atlas-accent-ink: #e0f2fe;
            --atlas-focus-ring: rgba(56, 189, 248, 0.18);
            --atlas-shadow: 0 24px 60px rgba(2, 6, 23, 0.28);
            --atlas-card-shadow: 0 18px 40px rgba(2, 6, 23, 0.2);
            --atlas-shadow-tier-1: 0 18px 38px rgba(2, 6, 23, 0.18);
            --atlas-shadow-tier-2: 0 16px 30px rgba(2, 6, 23, 0.16);
            --atlas-shadow-tier-3: 0 12px 24px rgba(2, 6, 23, 0.14);
            --atlas-shadow-hover: 0 22px 46px rgba(2, 6, 23, 0.2);
            --atlas-motion-lift: translateY(-2px);
            --atlas-control-y: 0.7rem;
            --atlas-control-x: 1.05rem;
            --atlas-card-padding: 1.15rem;
            --atlas-card-padding-compact: 1rem 1.15rem;
            --atlas-grid-gap: 1rem;
        }

        html.atlas-theme-light {
            --atlas-bg: linear-gradient(180deg, #f5f8fc 0%, #eef4fb 45%, #e8eef8 100%);
            --atlas-spot-a: rgba(14, 165, 233, 0.16);
            --atlas-spot-b: rgba(249, 115, 22, 0.14);
            --atlas-spot-c: rgba(20, 184, 166, 0.08);
            --atlas-panel: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.78));
            --atlas-panel-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.92));
            --atlas-panel-accent: linear-gradient(145deg, rgba(224, 242, 254, 0.96), rgba(255, 247, 237, 0.9));
            --atlas-subtle: rgba(255, 255, 255, 0.62);
            --atlas-chip: rgba(255, 255, 255, 0.64);
            --atlas-chip-hover: rgba(255, 255, 255, 0.88);
            --atlas-stat: rgba(255, 255, 255, 0.74);
            --atlas-code: rgba(241, 245, 249, 0.92);
            --atlas-line: rgba(71, 85, 105, 0.16);
            --atlas-line-strong: rgba(71, 85, 105, 0.28);
            --atlas-heading: #0f172a;
            --atlas-copy: #334155;
            --atlas-muted: #64748b;
            --atlas-muted-strong: #1e293b;
            --atlas-accent: #0f766e;
            --atlas-accent-soft: rgba(13, 148, 136, 0.12);
            --atlas-accent-line: rgba(13, 148, 136, 0.3);
            --atlas-accent-ink: #115e59;
            --atlas-focus-ring: rgba(13, 148, 136, 0.14);
            --atlas-shadow: 0 24px 60px rgba(148, 163, 184, 0.18);
            --atlas-card-shadow: 0 18px 36px rgba(148, 163, 184, 0.16);
            --atlas-shadow-tier-1: 0 18px 34px rgba(148, 163, 184, 0.14);
            --atlas-shadow-tier-2: 0 14px 26px rgba(148, 163, 184, 0.12);
            --atlas-shadow-tier-3: 0 10px 20px rgba(148, 163, 184, 0.1);
            --atlas-shadow-hover: 0 20px 40px rgba(148, 163, 184, 0.16);
            --atlas-motion-lift: translateY(-2px);
        }

        html.atlas-theme-light[data-atlas-surface="public"] {
            --atlas-spot-a: rgba(34, 197, 94, 0.11);
            --atlas-spot-b: rgba(249, 115, 22, 0.1);
            --atlas-panel-accent: linear-gradient(145deg, rgba(220, 252, 231, 0.9), rgba(255, 247, 237, 0.92));
            --atlas-chip-hover: rgba(255, 255, 255, 0.96);
            --atlas-accent: #0f766e;
            --atlas-accent-soft: rgba(15, 118, 110, 0.14);
            --atlas-accent-line: rgba(15, 118, 110, 0.32);
            --atlas-accent-ink: #134e4a;
            --atlas-focus-ring: rgba(15, 118, 110, 0.16);
        }

        html.atlas-theme-dark[data-atlas-surface="internal"] {
            --atlas-spot-a: rgba(56, 189, 248, 0.14);
            --atlas-spot-b: rgba(249, 115, 22, 0.12);
            --atlas-panel-accent: linear-gradient(145deg, rgba(17, 94, 89, 0.28), rgba(30, 41, 59, 0.8));
            --atlas-chip-hover: rgba(37, 99, 235, 0.18);
            --atlas-accent: #67e8f9;
            --atlas-accent-soft: rgba(103, 232, 249, 0.18);
            --atlas-accent-line: rgba(34, 211, 238, 0.42);
            --atlas-accent-ink: #cffafe;
            --atlas-focus-ring: rgba(34, 211, 238, 0.18);
        }

        html.atlas-theme-light,
        html.atlas-theme-dark {
            color-scheme: light dark;
        }

        html.atlas-density-comfortable {
            --atlas-control-y: 0.88rem;
            --atlas-control-x: 1.2rem;
            --atlas-card-padding: 1.35rem;
            --atlas-card-padding-compact: 1.15rem 1.25rem;
            --atlas-grid-gap: 1.2rem;
        }

        html.atlas-density-compact {
            --atlas-control-y: 0.62rem;
            --atlas-control-x: 0.98rem;
            --atlas-card-padding: 1rem;
            --atlas-card-padding-compact: 0.92rem 1rem;
            --atlas-grid-gap: 0.85rem;
        }

        body.atlas-shell {
            color: var(--atlas-heading) !important;
            background:
                radial-gradient(circle at 12% 14%, var(--atlas-spot-a), transparent 24%),
                radial-gradient(circle at 86% 10%, var(--atlas-spot-b), transparent 20%),
                radial-gradient(circle at 70% 72%, var(--atlas-spot-c), transparent 24%),
                var(--atlas-bg) !important;
            background-attachment: fixed;
        }

        body.atlas-shell::before {
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.08), transparent 16%),
                radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.06), transparent 14%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 24%);
            opacity: 0.9;
        }

        body.atlas-shell::after {
            content: "";
            position: fixed;
            inset: auto 0 0 0;
            height: 16rem;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.04));
            z-index: 0;
        }

        .atlas-shell h1,
        .atlas-shell h2,
        .atlas-shell h3,
        .atlas-shell h4 {
            color: var(--atlas-heading) !important;
        }

        .atlas-shell p[class*="text-slate-300"],
        .atlas-shell li[class*="text-slate-300"],
        .atlas-shell div[class*="text-slate-300"] {
            color: var(--atlas-copy) !important;
        }

        .atlas-shell p[class*="text-slate-400"],
        .atlas-shell small[class*="text-slate-400"],
        .atlas-shell [class*="text-slate-400"] {
            color: var(--atlas-muted) !important;
        }

        .atlas-shell [class*="text-white"] {
            color: var(--atlas-heading) !important;
        }

        .atlas-shell [class*="text-cyan-300"],
        .atlas-shell [class*="text-cyan-100"] {
            color: var(--atlas-accent) !important;
        }

        .atlas-shell [class*="rounded-[2.25rem]"],
        .atlas-shell [class*="rounded-\[2\.25rem\]"] {
            background: var(--atlas-panel-strong) !important;
            border-color: var(--atlas-line) !important;
            box-shadow: var(--atlas-shadow) !important;
            backdrop-filter: blur(18px);
        }

        .atlas-shell [class*="rounded-[1.5rem]"],
        .atlas-shell [class*="rounded-\[1\.5rem\]"] {
            background: var(--atlas-panel) !important;
            border-color: var(--atlas-line) !important;
            box-shadow: var(--atlas-card-shadow) !important;
            backdrop-filter: blur(16px);
        }

        .atlas-shell [class*="bg-slate-950/60 p-4"],
        .atlas-shell [class*="bg-slate-950/55 p-6"],
        .atlas-shell [class*="bg-slate-950/45 px-4 py-3"],
        .atlas-shell [class*="bg-slate-950/40 p-4"],
        .atlas-shell [class*="bg-slate-950/40 px-4 py-3"] {
            border-color: var(--atlas-line) !important;
        }

        .atlas-shell [class*="bg-slate-950/60 p-4"] {
            background: var(--atlas-stat) !important;
        }

        .atlas-shell [class*="bg-slate-950/45 px-4 py-3"],
        .atlas-shell [class*="bg-slate-950/40 p-4"],
        .atlas-shell [class*="bg-slate-950/40 px-4 py-3"] {
            background: var(--atlas-subtle) !important;
        }

        .atlas-shell pre[class*="bg-black/40"] {
            background: var(--atlas-code) !important;
            border-color: var(--atlas-line) !important;
            color: var(--atlas-copy) !important;
        }

        .atlas-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border-radius: 999px;
            border: 1px solid var(--atlas-line);
            padding: var(--atlas-control-y) var(--atlas-control-x);
            font-size: 0.92rem;
            font-weight: 650;
            line-height: 1;
            transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease, color 140ms ease;
            backdrop-filter: blur(10px);
        }

        .atlas-pill:hover {
            transform: translateY(-1px);
        }

        .atlas-pill:focus-visible {
            transform: translateY(-1px);
        }

        .atlas-pill-active {
            background: linear-gradient(135deg, var(--atlas-accent-soft), rgba(255, 255, 255, 0.06));
            border-color: var(--atlas-accent-line);
            color: var(--atlas-accent-ink) !important;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
        }

        .atlas-pill-inactive {
            background: var(--atlas-chip);
            color: var(--atlas-muted-strong) !important;
        }

        .atlas-pill-inactive:hover {
            background: var(--atlas-chip-hover);
            border-color: var(--atlas-line-strong);
            color: var(--atlas-heading) !important;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .atlas-surface-copy {
            color: var(--atlas-copy) !important;
            line-height: 1.75;
        }

        .atlas-nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .atlas-stat-grid {
            display: grid;
            gap: var(--atlas-grid-gap);
            grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
        }

        .atlas-shell-card,
        .atlas-setting-card {
            border: 1px solid var(--atlas-line);
            border-radius: 1.4rem;
            background: var(--atlas-subtle);
            padding: var(--atlas-card-padding);
            box-shadow: var(--atlas-shadow-tier-1), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .atlas-shell-card .atlas-shell-card,
        .atlas-shell-card .atlas-setting-card,
        .atlas-setting-card .atlas-shell-card,
        .atlas-setting-card .atlas-setting-card {
            box-shadow: var(--atlas-shadow-tier-2), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .atlas-shell-card .atlas-shell-card .atlas-shell-card,
        .atlas-shell-card .atlas-shell-card .atlas-setting-card,
        .atlas-shell-card .atlas-setting-card .atlas-setting-card,
        .atlas-setting-card .atlas-setting-card .atlas-setting-card,
        .atlas-setting-card .atlas-setting-card .atlas-shell-card {
            box-shadow: var(--atlas-shadow-tier-3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .atlas-shell-card-accent {
            background: var(--atlas-panel-accent);
        }

        .atlas-empty-state {
            border: 1px dashed var(--atlas-line-strong);
            border-radius: 1.4rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(148, 163, 184, 0.04));
            padding: var(--atlas-card-padding);
        }

        .atlas-setting-card-compact {
            padding: var(--atlas-card-padding-compact);
        }

        .atlas-product-hero-grid {
            align-items: start;
        }

        .atlas-density-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            border: 1px solid var(--atlas-line);
            border-radius: 1.2rem;
            background: var(--atlas-panel);
        }

        .atlas-density-preview-compact {
            padding: 0.7rem 0.8rem;
        }

        .atlas-density-preview-comfortable {
            padding: 1rem 1.05rem;
        }

        .atlas-shell-rail-mobile {
            display: none;
        }

        .atlas-mobile-nav-grid {
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .atlas-shell-rail-mobile {
            position: relative;
            overflow: hidden;
        }

        .atlas-shell-rail-mobile::after {
            content: "";
            position: absolute;
            inset: auto -18% -30% auto;
            width: 10rem;
            height: 10rem;
            border-radius: 999px;
            background: radial-gradient(circle, var(--atlas-accent-soft), transparent 68%);
            pointer-events: none;
            opacity: 0.75;
        }

        .atlas-kicker {
            color: var(--atlas-muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .atlas-panel-note {
            color: var(--atlas-muted) !important;
            line-height: 1.65;
        }

        .atlas-chip-label {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid var(--atlas-line);
            background: rgba(255, 255, 255, 0.06);
            padding: 0.45rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--atlas-muted-strong);
        }

        .atlas-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: 1px solid var(--atlas-line);
            padding: 0.42rem 0.72rem;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .atlas-badge-neutral {
            background: rgba(148, 163, 184, 0.1);
            color: var(--atlas-muted-strong);
        }

        .atlas-badge-warm {
            background: rgba(251, 146, 60, 0.14);
            border-color: rgba(251, 146, 60, 0.24);
            color: #fdba74;
        }

        .atlas-badge-success {
            background: rgba(16, 185, 129, 0.14);
            border-color: rgba(16, 185, 129, 0.24);
            color: #6ee7b7;
        }

        .atlas-badge-danger {
            background: rgba(248, 113, 113, 0.14);
            border-color: rgba(248, 113, 113, 0.24);
            color: #fca5a5;
        }

        html.atlas-theme-light .atlas-badge-warm {
            color: #b45309;
        }

        html.atlas-theme-light .atlas-badge-success {
            color: #047857;
        }

        html.atlas-theme-light .atlas-badge-danger {
            color: #b91c1c;
        }

        .atlas-link-tile {
            display: block;
            border-radius: 1.1rem;
            border: 1px solid var(--atlas-line);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.95rem 1rem;
            text-decoration: none;
            transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
        }

        .atlas-link-tile:hover {
            transform: translateY(-1px);
            border-color: var(--atlas-line-strong);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
        }

        .atlas-link-tile:focus-visible {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08), 0 0 0 4px var(--atlas-focus-ring);
        }

        .atlas-link-title {
            display: block;
            color: var(--atlas-heading);
            font-weight: 700;
        }

        .atlas-link-copy {
            display: block;
            margin-top: 0.45rem;
            color: var(--atlas-muted);
            line-height: 1.55;
            font-size: 0.92rem;
        }

        .atlas-input {
            border-radius: 1.1rem;
            border: 1px solid var(--atlas-line);
            background: rgba(255, 255, 255, 0.04);
            color: var(--atlas-heading);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .atlas-input::placeholder {
            color: var(--atlas-muted);
        }

        .atlas-input:focus {
            outline: none;
            border-color: var(--atlas-accent-line);
            box-shadow: 0 0 0 4px var(--atlas-focus-ring);
        }

        .atlas-shell a:focus-visible,
        .atlas-shell button:focus-visible,
        .atlas-shell input:focus-visible,
        .atlas-shell select:focus-visible,
        .atlas-shell textarea:focus-visible,
        .atlas-shell [tabindex]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--atlas-focus-ring);
            border-color: var(--atlas-accent-line) !important;
        }

        .atlas-shell-card:hover,
        .atlas-setting-card:hover {
            transform: var(--atlas-motion-lift);
            box-shadow: var(--atlas-shadow-hover);
        }

        .atlas-shell-card:focus-within,
        .atlas-setting-card:focus-within {
            transform: var(--atlas-motion-lift);
            box-shadow: var(--atlas-shadow-hover);
        }

        .atlas-visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        html[lang="ar"] .atlas-shell h1,
        html[lang="ar"] .atlas-shell h2,
        html[lang="ar"] .atlas-shell h3 {
            letter-spacing: -0.018em;
            font-weight: 780 !important;
            line-height: 1.3;
        }

        html[lang="ar"] .atlas-kicker {
            letter-spacing: 0.14em;
            font-weight: 760;
        }

        html[lang="ar"] .atlas-link-title,
        html[lang="ar"] .atlas-badge,
        html[lang="ar"] .atlas-pill {
            letter-spacing: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .atlas-shell *,
            .atlas-shell *::before,
            .atlas-shell *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }

            .atlas-pill:hover,
            .atlas-shell-card:hover,
            .atlas-setting-card:hover {
                transform: none;
            }
        }

        @media (max-width: 768px) {
            .atlas-shell-rail-desktop {
                display: none;
            }

            .atlas-shell-rail-mobile {
                display: block;
            }

            .atlas-product-hero-aside {
                order: 2;
            }

            .atlas-shell [class*="text-5xl"] {
                font-size: 2.75rem !important;
                line-height: 1.04 !important;
            }

            .atlas-mobile-nav-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .atlas-dashboard-metric-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: start;
            }

            .atlas-dashboard-handoff-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .atlas-mobile-nav-grid {
                grid-template-columns: 1fr;
            }

            .atlas-product-hero-grid,
            .atlas-dashboard-grid {
                gap: 1rem;
            }

            .atlas-dashboard-metric-grid,
            .atlas-dashboard-handoff-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="../../../static/script/wasm_exec.js"></script>
    <script src="../../../static/script/example-logger.js"></script>
</head>
<body class="min-h-screen bg-[#08111d] text-slate-100 example-shell atlas-shell">
    <div id="atlas-route-announcer" class="atlas-visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <div id="app"></div>
    <!-- Atlas overlay and portal host: secondary UI must render here rather than inside #app. -->
    <div id="atlas-overlay-root" data-atlas-portal-host="overlays"></div>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../../../static/bin/atlas-commerce-os.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
