<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Go WebAssembly Example with Tailwind CSS and a minimalist loading bar."
    />
    <meta name="author" content="Go Web Components" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link
      rel="icon"
      href="images/favicon/favicon.ico"
      type="image/x-icon"
    />

    <title>GoWebComponents - Loading Example...</title>
    <script src="https://cdn.tailwindcss.com" rel="stylesheet"></script>
    <script src="script/wasm_exec.js"></script>
    <style>
      body {
        background-color: #1a202c; /* Tailwind's gray-900 */
        color: #f7fafc; /* Tailwind's gray-100 */
      }

      #app {
        transition: opacity 0.5s ease-in-out;
        opacity: 0;
      }

      #app.loaded {
        opacity: 1;
      }

      .loading-bar {
        height: 4px;
        background-color: #4a5568; /* Tailwind's gray-700 */
        transition: width 0.2s ease-in-out;
      }

      .footer {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #2d3748; /* Tailwind's gray-800 */
        padding: 10px 20px;
        border-radius: 5px;
      }

      .footer a {
        color: #63b3ed; /* Tailwind's blue-400 */
        text-decoration: none;
      }
    </style>
    <script>
      const go = new Go();

      function updateProgress(bytesDownloaded, totalBytes) {
        const loadingBar = document.getElementById("loading-bar");
        const percentage = (bytesDownloaded / totalBytes) * 100;
        loadingBar.style.width = percentage + "%";
        document.getElementById("progress-text").innerText = `${(
          bytesDownloaded / 1024
        ).toFixed(2)}KB of ${(totalBytes / 1024).toFixed(2)}KB downloaded`;
      }

      function removeLoadingBar() {
        const appElement = document.getElementById("app");
        const loadingElement = document.getElementById("loading-container");
        
        if (appElement) {
          appElement.classList.add("loaded");
        }
        
        if (loadingElement) {
          loadingElement.remove();
        }
      }

      function showError(message) {
        const loadingContainer = document.getElementById("loading-container");
        loadingContainer.innerHTML = `
          <div class="text-center">
            <div class="text-red-400 mb-4">❌ Error Loading WebAssembly</div>
            <div class="text-sm text-gray-400">${message}</div>
            <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
              Retry
            </button>
          </div>
        `;
      }

      async function loadWasm() {
        try {
          // Check WebAssembly support
          if (!WebAssembly.instantiateStreaming) {
            throw new Error("WebAssembly streaming is not supported in this browser");
          }

          // Fetch with progress tracking
          const response = await fetch("bin/main.wasm");
          if (!response.ok) {
            throw new Error(`Failed to fetch WASM file: ${response.status} ${response.statusText}`);
          }

          const totalBytes = parseInt(response.headers.get('content-length')) || 0;
          const reader = response.body.getReader();
          let bytesDownloaded = 0;
          const chunks = [];

          // Read the stream with progress updates
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            chunks.push(value);
            bytesDownloaded += value.length;
            
            if (totalBytes > 0) {
              updateProgress(bytesDownloaded, totalBytes);
            }
          }

          // Combine chunks and instantiate
          const wasmBytes = new Uint8Array(bytesDownloaded);
          let offset = 0;
          for (const chunk of chunks) {
            wasmBytes.set(chunk, offset);
            offset += chunk.length;
          }

          const result = await WebAssembly.instantiate(wasmBytes, go.importObject);
          
          // Ensure DOM is ready before running WebAssembly
          setTimeout(() => {
            // Run the WebAssembly module
            go.run(result.instance);
            removeLoadingBar();
            window.document.title = "GoWebComponents - VMware Dashboard";
          }, 100);
          
        } catch (error) {
          console.error("WebAssembly loading error:", error);
          showError(error.message);
        }
      }

      // Start loading when the page is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadWasm);
      } else {
        loadWasm();
      }
    </script>
  </head>

  <body>
    <div id="app"></div>

    <div
      id="loading-container"
      class="flex items-center justify-center h-screen"
    >
      <div>
        <div id="progress-text" class="text-center mb-4">Loading WASM...</div>
        <div class="w-full bg-gray-800 rounded-full">
          <div id="loading-bar" class="loading-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>

      <a
        href="https://github.com/monstercameron/GoWebComponents"
        target="_blank"
        >GitHub: GoWebComponents</a
      >
    </div> -->
  </body>
</html>
