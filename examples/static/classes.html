<!-- This file contains all Tailwind classes used in the blog landing page for scanning -->
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="container mx-auto px-6">
    <div class="flex items-center justify-between py-6">
      <div class="flex items-center space-x-3">
        <div class="text-2xl font-bold text-indigo-600"></div>
        <div class="bg-indigo-100 text-indigo-600 text-xs font-semibold px-2 py-1 rounded"></div>
      </div>
      <nav class="flex space-x-8">
        <a class="text-gray-700 hover:text-indigo-600 transition-colors font-medium"></a>
      </nav>
    </div>
  </div>
  
  <section class="py-20 px-6">
    <div class="text-5xl font-extrabold text-gray-900 mb-6"></div>
    <div class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto leading-relaxed"></div>
    <button class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-lg"></button>
    <button class="border-2 border-indigo-600 text-indigo-600 px-8 py-3 rounded-lg font-semibold hover:bg-indigo-50 transition-colors"></button>
    <div class="mt-8 space-y-4">
      <div class="text-lg font-semibold text-gray-800"></div>
      <div class="test-component bg-red-100 p-4 rounded"></div>
    </div>
  </section>
  
  <section class="py-16 bg-white">
    <div class="text-4xl font-bold text-gray-900 mb-12 text-center"></div>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300 transform hover:-translate-y-1">
        <div class="h-48 bg-cover bg-center"></div>
        <div class="p-6">
          <div class="flex items-center justify-between mb-3">
            <span class="bg-blue-100 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full"></span>
            <span class="text-sm text-gray-500"></span>
          </div>
          <h4 class="text-xl font-bold text-gray-900 mb-2 hover:text-indigo-600 transition-colors"></h4>
          <p class="text-gray-600 mb-4 line-clamp-2"></p>
          <a class="text-indigo-600 font-semibold hover:text-indigo-800 transition-colors inline-flex items-center"></a>
        </div>
      </div>
    </div>
  </section>
  
  <section class="py-16 bg-gray-50">
    <div class="text-3xl font-bold text-gray-900 mb-6 text-center"></div>
    <blockquote class="text-xl text-gray-600 italic mb-8 max-w-3xl mx-auto text-center"></blockquote>
    <div class="grid md:grid-cols-3 gap-8 mb-8 text-center">
      <div class="text-5xl font-bold text-indigo-600"></div>
      <div class="text-2xl font-semibold text-gray-700"></div>
    </div>
  </section>
  
  <section class="py-16 bg-indigo-600">
    <div class="text-3xl font-bold text-white mb-4"></div>
    <div class="text-indigo-100 mb-8 max-w-2xl mx-auto"></div>
    <form class="flex justify-center max-w-md mx-auto">
      <input class="flex-1 px-4 py-3 rounded-l-lg border-0 focus:ring-2 focus:ring-indigo-300 outline-none" />
      <button class="bg-white text-indigo-600 px-6 py-3 rounded-r-lg font-semibold hover:bg-gray-100 transition-colors"></button>
    </form>
  </section>
  
  <footer class="bg-gray-900 text-white py-12">
    <div class="grid md:grid-cols-4 gap-8">
      <div class="text-lg font-semibold mb-4"></div>
      <ul class="space-y-2">
        <li><a class="text-gray-400 hover:text-white transition-colors"></a></li>
      </ul>
    </div>
    <div class="border-t border-gray-800 mt-8 pt-8 text-center">
      <p class="text-gray-400"></p>
    </div>
  </footer>
</div>
