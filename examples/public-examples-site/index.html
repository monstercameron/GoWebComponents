<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoWebComponents Docs, APIs, and Examples</title>
    <link rel="icon" type="image/x-icon" href="../static/images/favicon/favicon.ico">
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <link rel="stylesheet" href="../static/css/example-shell.css">
    <script src="../static/script/wasm_exec.js"></script>
    <script src="../static/script/example-logger.js"></script>
    <style>
        html {
            scrollbar-gutter: stable;
        }

        .scrollbar-stable {
            scrollbar-gutter: stable;
        }

        #boot-shell {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.20), transparent 28%),
                radial-gradient(circle at top right, rgba(168, 85, 247, 0.18), transparent 24%),
                linear-gradient(180deg, #07111f 0%, #091427 40%, #0b1020 100%);
            transition: opacity 220ms ease;
            z-index: 20;
        }

        #boot-shell[data-state="ready"] {
            opacity: 0;
            pointer-events: none;
        }

        #boot-shell-card {
            width: min(100%, 40rem);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
        }

        #boot-progress-track {
            width: 100%;
            height: 0.75rem;
            border-radius: 9999px;
            overflow: hidden;
            background: rgba(148, 163, 184, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #boot-progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.92), rgba(59, 130, 246, 0.95));
            transition: width 120ms linear;
        }

        #boot-shell[data-indeterminate="true"] #boot-progress-bar {
            width: 35%;
            animation: boot-progress-indeterminate 1.1s ease-in-out infinite;
        }

        @keyframes boot-progress-indeterminate {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }

        #boot-support-note,
        #boot-error-box {
            display: none;
        }

        #boot-shell[data-state="error"] #boot-error-box,
        #boot-shell[data-state="error"] #boot-support-note {
            display: block;
        }

        #boot-shell[data-state="error"] #boot-progress-track {
            display: none;
        }

        #app[data-boot="pending"] {
            visibility: hidden;
        }
    </style>
</head>
<body class="bg-[#08111d] text-white min-h-screen example-shell">
    <div id="boot-shell" data-state="loading" data-indeterminate="true" aria-live="polite">
        <div id="boot-shell-card">
            <div class="text-xs uppercase tracking-[0.18em] text-cyan-200">GoWebComponents runtime</div>
            <h1 class="mt-3 text-3xl font-semibold tracking-tight text-white">Loading GoWebComponents client</h1>
            <p id="boot-status" class="mt-3 text-sm leading-7 text-slate-300">Preparing WebAssembly runtime...</p>
            <div class="mt-5 flex items-center justify-between gap-3 text-xs uppercase tracking-[0.18em] text-slate-400">
                <span id="boot-phase">Starting</span>
                <span id="boot-percent">0%</span>
            </div>
            <div id="boot-progress-track" class="mt-3">
                <div id="boot-progress-bar"></div>
            </div>
            <div id="boot-error-box" class="mt-5 rounded-2xl border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm leading-6 text-rose-100"></div>
            <p id="boot-support-note" class="mt-4 text-sm leading-6 text-slate-300">
                This example requires a browser with WebAssembly, JavaScript streaming APIs, and support for the Go wasm runtime.
            </p>
        </div>
    </div>
    <div id="app" data-boot="pending"></div>
    <script>
        window.__gwcMountEmbeddedExample = (() => {
            const mounts = new Map();

            function ensureCompatibility() {
                if (typeof WebAssembly === 'undefined') {
                    throw new Error('WebAssembly is not available in this browser.');
                }
                if (typeof Go === 'undefined') {
                    throw new Error('The Go WebAssembly runtime script did not load.');
                }
                if (typeof fetch !== 'function') {
                    throw new Error('Fetch is not available in this browser.');
                }
            }

            function shouldStreamInstantiate(response) {
                if (typeof WebAssembly.instantiateStreaming !== 'function') {
                    return false;
                }
                if (!response.body || typeof response.body.getReader !== 'function') {
                    return false;
                }
                const contentTypeHeader = response.headers.get('content-type') || '';
                return contentTypeHeader.toLowerCase().includes('application/wasm');
            }

            async function fetchWasmWithProgress(url, onProgress) {
                onProgress(5, {
                    indeterminate: true,
                    phase: 'Connecting',
                    message: 'Requesting the embedded WebAssembly binary...'
                });

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('The embedded wasm binary could not be fetched (' + response.status + ' ' + response.statusText + ').');
                }

                if (shouldStreamInstantiate(response)) {
                    onProgress(70, {
                        indeterminate: true,
                        phase: 'Downloading',
                        message: 'Downloading and compiling embedded WebAssembly...'
                    });
                    return { shouldStream: true, response };
                }

                const contentLengthHeader = response.headers.get('content-length');
                const totalBytes = contentLengthHeader ? Number(contentLengthHeader) : 0;
                if (!response.body || typeof response.body.getReader !== 'function') {
                    onProgress(50, {
                        indeterminate: true,
                        phase: 'Downloading',
                        message: 'Downloading embedded WebAssembly binary...'
                    });
                    return { shouldStream: false, bytes: new Uint8Array(await response.arrayBuffer()) };
                }

                const reader = response.body.getReader();
                const chunks = [];
                let receivedBytes = 0;
                while (true) {
                    const result = await reader.read();
                    if (result.done) {
                        break;
                    }
                    chunks.push(result.value);
                    receivedBytes += result.value.length;
                    if (totalBytes > 0) {
                        const progress = 10 + ((receivedBytes / totalBytes) * 70);
                        onProgress(progress, {
                            indeterminate: false,
                            phase: 'Downloading',
                            message: 'Downloading embedded WebAssembly binary...'
                        });
                    } else {
                        onProgress(50, {
                            indeterminate: true,
                            phase: 'Downloading',
                            message: 'Downloading embedded WebAssembly binary...'
                        });
                    }
                }

                const bytes = new Uint8Array(receivedBytes);
                let offset = 0;
                for (const chunk of chunks) {
                    bytes.set(chunk, offset);
                    offset += chunk.length;
                }
                return { shouldStream: false, bytes };
            }

            return async function mountEmbeddedExample(options) {
                const root = document.getElementById(options.rootID);
                const shell = document.getElementById(options.shellID);
                if (!root || !shell || !options.wasmURL) {
                    return;
                }

                const current = mounts.get(options.rootID);
                if (current && current.root === root && (current.status === 'loading' || current.status === 'ready')) {
                    return;
                }

                const statusNode = shell.querySelector('[data-embed-status]');
                const phaseNode = shell.querySelector('[data-embed-phase]');
                const percentNode = shell.querySelector('[data-embed-percent]');
                const progressBar = shell.querySelector('[data-embed-progress]');
                const errorBox = shell.querySelector('[data-embed-error]');
                const minimumVisibleMs = 150;
                const startedAt = performance.now();
                const state = { root, status: 'loading' };
                mounts.set(options.rootID, state);

                function setProgress(percent, meta) {
                    const resolved = meta || {};
                    const clamped = Math.max(0, Math.min(100, Math.round(percent)));
                    shell.dataset.indeterminate = resolved.indeterminate ? 'true' : 'false';
                    if (progressBar) {
                        progressBar.style.width = clamped + '%';
                    }
                    if (percentNode) {
                        percentNode.textContent = resolved.indeterminate ? '...' : clamped + '%';
                    }
                    if (phaseNode && resolved.phase) {
                        phaseNode.textContent = resolved.phase;
                    }
                    if (statusNode && resolved.message) {
                        statusNode.textContent = resolved.message;
                    }
                }

                function setError(title, detail) {
                    state.status = 'error';
                    shell.dataset.state = 'error';
                    shell.dataset.indeterminate = 'false';
                    if (progressBar) {
                        progressBar.style.width = '100%';
                    }
                    if (phaseNode) {
                        phaseNode.textContent = title;
                    }
                    if (percentNode) {
                        percentNode.textContent = 'Failed';
                    }
                    if (statusNode) {
                        statusNode.textContent = detail;
                    }
                    if (errorBox) {
                        errorBox.textContent = detail;
                        errorBox.classList.remove('hidden');
                    }
                }

                async function enforceMinimumVisibleTime() {
                    const elapsed = performance.now() - startedAt;
                    const remaining = minimumVisibleMs - elapsed;
                    if (remaining > 0) {
                        await new Promise((resolve) => setTimeout(resolve, remaining));
                    }
                }

                root.dataset.boot = 'pending';
                root.style.visibility = 'hidden';
                root.innerHTML = '';
                shell.dataset.state = 'loading';
                shell.style.opacity = '1';
                shell.style.pointerEvents = 'auto';
                if (errorBox) {
                    errorBox.classList.add('hidden');
                    errorBox.textContent = '';
                }

                try {
                    ensureCompatibility();
                    const wasmPayload = await fetchWasmWithProgress(options.wasmURL, setProgress);
                    if (mounts.get(options.rootID) !== state || document.getElementById(options.rootID) !== root) {
                        return;
                    }

                    window.__gwcExampleMountSelector = '#' + options.rootID;
                    const go = new Go();
                    let result;
                    if (wasmPayload.shouldStream) {
                        result = await WebAssembly.instantiateStreaming(Promise.resolve(wasmPayload.response), go.importObject);
                    } else {
                        setProgress(88, {
                            indeterminate: false,
                            phase: 'Compiling',
                            message: 'Compiling and instantiating embedded WebAssembly...'
                        });
                        result = await WebAssembly.instantiate(wasmPayload.bytes, go.importObject);
                    }

                    setProgress(100, {
                        indeterminate: false,
                        phase: 'Starting',
                        message: 'Starting embedded counter demo...'
                    });

                    await enforceMinimumVisibleTime();
                    if (mounts.get(options.rootID) !== state || document.getElementById(options.rootID) !== root) {
                        return;
                    }

                    root.dataset.boot = 'ready';
                    root.style.visibility = 'visible';
                    shell.dataset.state = 'ready';
                    shell.style.opacity = '0';
                    shell.style.pointerEvents = 'none';
                    state.status = 'ready';
                    go.run(result.instance);
                } catch (error) {
                    const detail = error instanceof Error ? error.message : String(error);
                    setError('Compatibility error', detail);
                }
            };
        })();

        (async function bootstrapPublicExamplesSite() {
            const shell = document.getElementById('boot-shell');
            const appRoot = document.getElementById('app');
            const statusNode = document.getElementById('boot-status');
            const percentNode = document.getElementById('boot-percent');
            const phaseNode = document.getElementById('boot-phase');
            const progressBar = document.getElementById('boot-progress-bar');
            const errorBox = document.getElementById('boot-error-box');
            const pageVersion = new URLSearchParams(window.location.search).get('v');
            const wasmURL = pageVersion
                ? '../static/bin/public-examples-site.wasm?v=' + encodeURIComponent(pageVersion)
                : '../static/bin/public-examples-site.wasm';
            const minimumVisibleMs = 150;
            const bootStartedAt = performance.now();

            function setProgress(percent, options) {
                const resolved = options || {};
                const clamped = Math.max(0, Math.min(100, Math.round(percent)));
                shell.dataset.indeterminate = resolved.indeterminate ? 'true' : 'false';
                progressBar.style.width = clamped + '%';
                percentNode.textContent = resolved.indeterminate ? '...' : clamped + '%';
                if (resolved.phase) {
                    phaseNode.textContent = resolved.phase;
                }
                if (resolved.message) {
                    statusNode.textContent = resolved.message;
                }
            }

            function setError(title, detail) {
                shell.dataset.state = 'error';
                shell.dataset.indeterminate = 'false';
                progressBar.style.width = '100%';
                phaseNode.textContent = title;
                percentNode.textContent = 'Failed';
                statusNode.textContent = detail;
                errorBox.textContent = detail;
                console.error('Failed to load WASM:', detail);
            }

            function ensureCompatibility() {
                if (typeof WebAssembly === 'undefined') {
                    throw new Error('WebAssembly is not available in this browser.');
                }
                if (typeof Go === 'undefined') {
                    throw new Error('The Go WebAssembly runtime script did not load.');
                }
                if (typeof fetch !== 'function') {
                    throw new Error('Fetch is not available in this browser.');
                }
            }

            function shouldStreamInstantiate(response) {
                if (typeof WebAssembly.instantiateStreaming !== 'function') {
                    return false;
                }
                if (!response.body || typeof response.body.getReader !== 'function') {
                    return false;
                }
                const contentTypeHeader = response.headers.get('content-type') || '';
                return contentTypeHeader.toLowerCase().includes('application/wasm');
            }

            async function fetchWasmWithProgress(url) {
                setProgress(5, {
                    indeterminate: true,
                    phase: 'Connecting',
                    message: 'Requesting the WebAssembly binary...'
                });

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('The WebAssembly binary could not be fetched (' + response.status + ' ' + response.statusText + ').');
                }

                if (shouldStreamInstantiate(response)) {
                    setProgress(70, {
                        indeterminate: true,
                        phase: 'Downloading',
                        message: 'Downloading and compiling WebAssembly...'
                    });
                    return { shouldStream: true, response };
                }

                const contentLengthHeader = response.headers.get('content-length');
                const totalBytes = contentLengthHeader ? Number(contentLengthHeader) : 0;
                if (!response.body || typeof response.body.getReader !== 'function') {
                    setProgress(50, {
                        indeterminate: true,
                        phase: 'Downloading',
                        message: 'Downloading WebAssembly binary...'
                    });
                    return { shouldStream: false, bytes: new Uint8Array(await response.arrayBuffer()) };
                }

                const reader = response.body.getReader();
                const chunks = [];
                let receivedBytes = 0;
                while (true) {
                    const result = await reader.read();
                    if (result.done) {
                        break;
                    }
                    chunks.push(result.value);
                    receivedBytes += result.value.length;
                    if (totalBytes > 0) {
                        const progress = 10 + ((receivedBytes / totalBytes) * 70);
                        setProgress(progress, {
                            indeterminate: false,
                            phase: 'Downloading',
                            message: 'Downloading WebAssembly binary...'
                        });
                    } else {
                        setProgress(50, {
                            indeterminate: true,
                            phase: 'Downloading',
                            message: 'Downloading WebAssembly binary...'
                        });
                    }
                }

                const bytes = new Uint8Array(receivedBytes);
                let offset = 0;
                for (const chunk of chunks) {
                    bytes.set(chunk, offset);
                    offset += chunk.length;
                }
                return { shouldStream: false, bytes };
            }

            async function enforceMinimumVisibleTime() {
                const elapsed = performance.now() - bootStartedAt;
                const remaining = minimumVisibleMs - elapsed;
                if (remaining > 0) {
                    await new Promise((resolve) => setTimeout(resolve, remaining));
                }
            }

            try {
                ensureCompatibility();
                const wasmPayload = await fetchWasmWithProgress(wasmURL);

                const go = new Go();
                let result;
                if (wasmPayload.shouldStream) {
                    result = await WebAssembly.instantiateStreaming(Promise.resolve(wasmPayload.response), go.importObject);
                } else {
                    setProgress(88, {
                        indeterminate: false,
                        phase: 'Compiling',
                        message: 'Compiling and instantiating WebAssembly...'
                    });
                    result = await WebAssembly.instantiate(wasmPayload.bytes, go.importObject);
                }

                setProgress(100, {
                    indeterminate: false,
                    phase: 'Starting',
                    message: 'Starting the GoWebComponents client...'
                });

                await enforceMinimumVisibleTime();
                appRoot.dataset.boot = 'ready';
                shell.dataset.state = 'ready';
                go.run(result.instance);
            } catch (error) {
                const detail = error instanceof Error ? error.message : String(error);
                setError('Compatibility error', detail);
            }
        })();
    </script>
</body>
</html>
