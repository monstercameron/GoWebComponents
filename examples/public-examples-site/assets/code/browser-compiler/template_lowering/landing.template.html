<section class="rounded-[2rem] border border-white/10 bg-slate-950/85 p-8 shadow-2xl">
  <p class="text-xs uppercase tracking-[0.35em] text-cyan-300">{{.Eyebrow}}</p>
  <h1 class="mt-4 text-5xl font-black tracking-tight text-white">{{.Headline}}</h1>
  <p class="mt-4 text-lg leading-8 text-slate-300">{{.Summary}}</p>
  <div class="mt-6 flex flex-wrap gap-3">
    <span class="rounded-full border border-cyan-400/20 bg-cyan-400/10 px-4 py-2 text-sm font-semibold text-cyan-100">{{.PrimaryTag}}</span>
    <span class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-4 py-2 text-sm font-semibold text-emerald-100">{{.SecondaryTag}}</span>
  </div>
</section>
