<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Multi-Client Offline Shell</title>
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <link rel="stylesheet" href="../static/css/example-shell.css">
</head>
<body class="bg-[#08111d] text-white min-h-screen example-shell">
    <main class="mx-auto max-w-3xl px-6 py-16">
        <div class="rounded-[2rem] border border-cyan-300/20 bg-slate-950/70 p-8 shadow-[0_24px_60px_rgba(2,6,23,0.45)]">
            <p class="text-xs uppercase tracking-[0.35em] text-cyan-300">Offline multi-client shell</p>
            <h1 class="mt-4 text-4xl font-black tracking-tight text-white">Peer shell unavailable offline</h1>
            <p class="mt-4 text-lg leading-8 text-slate-300">The service worker cached this fallback document so tabs still land on a deliberate shell while the network is unavailable.</p>
        </div>
    </main>
</body>
</html>
