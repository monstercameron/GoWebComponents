<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Multi-Client Coordination - GoWebComponents</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="../static/images/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <link rel="stylesheet" href="../static/css/example-shell.css">
    <script src="../static/script/wasm_exec.js"></script>
    <script src="../static/script/example-logger.js"></script>
</head>
<body class="bg-[#08111d] text-white min-h-screen example-shell">
    <div id="app"></div>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../static/bin/pwa-multi-client.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
