// ChatService bridges the browser to an OpenAI streaming completion.
service ChatService {
  // Signup creates a new user account and returns a signed auth token.
  rpc Signup(SignupRequest) returns (AuthResponse);
  // Login validates a user credential pair and returns a signed auth token.
  rpc Login(LoginRequest) returns (AuthResponse);
  // Logout is a stateless acknowledgement for client token disposal.
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty);
  // GetSession resolves the current auth token, if any, into a user session.
  rpc GetSession(google.protobuf.Empty) returns (GetSessionResponse);
  // GetCatalogBootstrap returns one typed locale bootstrap for one namespace list with cache metadata.
  rpc GetCatalogBootstrap(GetCatalogBootstrapRequest) returns (GetCatalogBootstrapResponse);
  // GetCatalogNamespace returns one typed locale namespace payload with version/hash cache checks.
  rpc GetCatalogNamespace(GetCatalogNamespaceRequest) returns (GetCatalogNamespaceResponse);
  // RefreshSession issues a fresh signed auth token for the current user.
  rpc RefreshSession(google.protobuf.Empty) returns (AuthResponse);
  // GetClientIdentity returns a stable server-issued client identity for log correlation.
  rpc GetClientIdentity(google.protobuf.Empty) returns (GetClientIdentityResponse);
  // ReportClientLog forwards structured client telemetry to server-side logs.
  rpc ReportClientLog(ReportClientLogRequest) returns (google.protobuf.Empty);
  // GetLogTail returns the latest server/client log lines for authenticated superusers.
  rpc GetLogTail(GetLogTailRequest) returns (GetLogTailResponse);
  // GetServerToolPolicy returns server-side terminal execution policy and command whitelist.
  rpc GetServerToolPolicy(GetServerToolPolicyRequest) returns (GetServerToolPolicyResponse);
  // GetSuperuserOpsDiagnostics bundles log-tail, server-tool policy, and recent server-tool execution outcomes.
  rpc GetSuperuserOpsDiagnostics(GetSuperuserOpsDiagnosticsRequest) returns (GetSuperuserOpsDiagnosticsResponse);
  // SetServerToolPolicy updates server-side terminal execution policy and command whitelist.
  rpc SetServerToolPolicy(SetServerToolPolicyRequest) returns (SetServerToolPolicyResponse);
  // GetAdminDashboard returns one admin analytics snapshot for authenticated superusers.
  rpc GetAdminDashboard(GetAdminDashboardRequest) returns (GetAdminDashboardResponse);
  // GetSuperuserControlPlane returns the superuser control-plane snapshot for authenticated su users.
  rpc GetSuperuserControlPlane(GetSuperuserControlPlaneRequest) returns (GetSuperuserControlPlaneResponse);
  // ListAdminUsers returns recent users with aggregate spend and activity for authenticated superusers.
  rpc ListAdminUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);
  // ListAdminUsageEvents returns recent global usage ledger rows for authenticated superusers.
  rpc ListAdminUsageEvents(ListAdminUsageEventsRequest) returns (ListAdminUsageEventsResponse);
  // ListAdminConversations returns recent conversations with owner and spend rollups for authenticated superusers.
  rpc ListAdminConversations(ListAdminConversationsRequest) returns (ListAdminConversationsResponse);
  // GetAdminReadOnlyReport returns one allowlisted read-only admin report slice without raw SQL passthrough.
  rpc GetAdminReadOnlyReport(GetAdminReadOnlyReportRequest) returns (GetAdminReadOnlyReportResponse);
  // SearchAdminUsers returns typed user rows filtered by one query for authenticated admin callers.
  rpc SearchAdminUsers(SearchAdminUsersRequest) returns (SearchAdminUsersResponse);
  // GetAdminUserDetail returns one typed customer detail payload with session, usage, audit, workspace, memory, support, and billing slices.
  rpc GetAdminUserDetail(GetAdminUserDetailRequest) returns (GetAdminUserDetailResponse);
  // GetAdminCustomerAccountTimeline returns one typed merged customer timeline across chat, support, billing, auth-session, and audit sources.
  rpc GetAdminCustomerAccountTimeline(GetAdminCustomerAccountTimelineRequest) returns (GetAdminCustomerAccountTimelineResponse);
  // DisableAdminUser applies one typed admin user-disable mutation.
  rpc DisableAdminUser(AdminUserMutationRequest) returns (AdminUserMutationResponse);
  // RestoreAdminUser applies one typed admin user-restore mutation.
  rpc RestoreAdminUser(AdminUserMutationRequest) returns (AdminUserMutationResponse);
  // GetAdminWorkspaceDetail returns one typed workspace detail payload for authenticated admin callers.
  rpc GetAdminWorkspaceDetail(GetAdminWorkspaceDetailRequest) returns (GetAdminWorkspaceDetailResponse);
  // SuspendAdminWorkspace applies one typed workspace-suspend mutation.
  rpc SuspendAdminWorkspace(AdminWorkspaceMutationRequest) returns (AdminWorkspaceMutationResponse);
  // RestoreAdminWorkspace applies one typed workspace-restore mutation.
  rpc RestoreAdminWorkspace(AdminWorkspaceMutationRequest) returns (AdminWorkspaceMutationResponse);
  // RevokeWorkspaceAPIKey revokes one workspace API key in admin scope.
  rpc RevokeWorkspaceAPIKey(RevokeWorkspaceAPIKeyRequest) returns (RevokeWorkspaceAPIKeyResponse);
  // PauseWorkspaceWebhookEndpoint disables one workspace webhook endpoint in admin scope.
  rpc PauseWorkspaceWebhookEndpoint(PauseWorkspaceWebhookRequest) returns (PauseWorkspaceWebhookResponse);
  // ListAdminBillingAccessOverrides returns typed billing access overrides for one admin-target user.
  rpc ListAdminBillingAccessOverrides(ListAdminBillingAccessOverridesRequest) returns (ListAdminBillingAccessOverridesResponse);
  // ListAdminBillingEvents returns typed billing event-inspection rows for one admin-target user.
  rpc ListAdminBillingEvents(ListAdminBillingEventsRequest) returns (ListAdminBillingEventsResponse);
  // ListAdminBillingDunningEvents returns typed dunning-review rows for one admin-target user.
  rpc ListAdminBillingDunningEvents(ListAdminBillingDunningEventsRequest) returns (ListAdminBillingDunningEventsResponse);
  // SetAdminBillingAccessOverride stores one typed admin billing access override for one target user.
  rpc SetAdminBillingAccessOverride(AdminBillingAccessOverrideMutationRequest) returns (AdminBillingAccessOverrideMutationResponse);
  // SetAdminBillingQuotaOverride stores one typed admin billing quota override for one target user.
  rpc SetAdminBillingQuotaOverride(AdminBillingQuotaOverrideMutationRequest) returns (AdminBillingQuotaOverrideMutationResponse);
  // ResolveAdminBillingFailedPayment marks one failed-payment path resolved for one target user and invoice.
  rpc ResolveAdminBillingFailedPayment(ResolveAdminBillingFailedPaymentRequest) returns (ResolveAdminBillingFailedPaymentResponse);
  // GetAdminBusinessQueue returns typed failed-payment, dunning, top-account, and funnel queue slices.
  rpc GetAdminBusinessQueue(GetAdminBusinessQueueRequest) returns (GetAdminBusinessQueueResponse);
  // GetAdminBusinessAccountDetail returns typed business account drill-down rows for one target user.
  rpc GetAdminBusinessAccountDetail(GetAdminBusinessAccountDetailRequest) returns (GetAdminBusinessAccountDetailResponse);
  // GetAdminBusinessDrilldown returns one typed business drill-down snapshot for one admin-target user.
  rpc GetAdminBusinessDrilldown(GetAdminBusinessDrilldownRequest) returns (GetAdminBusinessDrilldownResponse);
  // GetAdminChatsDrilldown returns one typed chats drill-down snapshot for dashboard chats surfaces.
  rpc GetAdminChatsDrilldown(GetAdminChatsDrilldownRequest) returns (GetAdminChatsDrilldownResponse);
  // GetAdminChatsAnomalies returns typed failed/slow/high-cost/feature-usage anomaly slices for dashboard chats surfaces.
