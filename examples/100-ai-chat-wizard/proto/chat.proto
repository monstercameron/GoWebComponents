  bool is_applied = 1;
  string updated_at = 2;
  bool is_enabled = 3;
  int32 max_session_seconds = 4;
  int32 max_output_bytes = 5;
  repeated ServerToolPolicyRule approved_tools = 6;
  string source = 7;
}

message RunServerToolStart {
  string session_id = 1;
  string shell = 2; // "powershell" | "bash" | "auto"
  string command = 3;
  string cwd = 4;
  int32 timeout_seconds = 5;
}

message RunServerToolStdin {
  string session_id = 1;
  bytes chunk = 2;
  bool close = 3;
}

message RunServerToolSignal {
  string session_id = 1;
  string signal = 2;
}

message RunServerToolClose {
  string session_id = 1;
}

message RunServerToolRequest {
  oneof payload {
    RunServerToolStart start = 1;
    RunServerToolStdin stdin = 2;
    RunServerToolSignal signal = 3;
    RunServerToolClose close = 4;
  }
}

message RunServerToolStarted {
  string session_id = 1;
  string shell = 2;
  string cwd = 3;
  string started_at = 4;
}

message RunServerToolOutput {
  string session_id = 1;
  bytes chunk = 2;
  bool eof = 3;
}

message RunServerToolExit {
  string session_id = 1;
  int32 exit_code = 2;
  string finished_at = 3;
  string error = 4;
}

message RunServerToolError {
  string session_id = 1;
  string code = 2;
  string message = 3;
}

message RunServerToolEvent {
  oneof payload {
    RunServerToolStarted started = 1;
    RunServerToolOutput stdout = 2;
    RunServerToolOutput stderr = 3;
    RunServerToolExit exit = 4;
    RunServerToolError error = 5;
  }
}

