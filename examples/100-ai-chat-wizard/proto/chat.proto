}

message ServerToolPolicyRule {
  string tool_id = 1;
  string description = 2;
  bool is_enabled = 3;
  string shell = 4; // "powershell" | "bash" | "auto"
  repeated string argv_prefix = 5;
  repeated string allow_args_regex = 6;
  repeated string deny_args_regex = 7;
  repeated string allow_cwd_prefixes = 8;
}

message GetServerToolPolicyRequest {}

message GetServerToolPolicyResponse {
  bool is_enabled = 1;
  int32 max_session_seconds = 2;
  int32 max_output_bytes = 3;
