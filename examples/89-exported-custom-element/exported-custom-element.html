<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exported Custom Element Prototype - GoWebComponents</title>
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <link rel="stylesheet" href="../static/css/example-shell.css">
    <script src="../static/script/wasm_exec.js"></script>
    <script src="../static/script/example-logger.js"></script>
    <style>
        .host-lab {
            max-width: 72rem;
            margin: 0 auto 4rem;
            padding: 0 1.5rem;
        }
        .host-shell {
            border-radius: 2rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.72);
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.24);
        }
        .host-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            margin-top: 1.25rem;
        }
        .lab-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .lab-controls button {
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.28);
            background: rgba(8, 145, 178, 0.16);
            color: white;
            font-weight: 700;
            padding: 0.7rem 1rem;
        }
    </style>
    <script type="module">
        class GWCStatusTile extends HTMLElement {
            static observedAttributes = ["title", "tone", "detail"];

            constructor() {
                super();
                this.root = this.attachShadow({ mode: "open" });
                this.handleReady = () => this.mount();
            }

            connectedCallback() {
                window.addEventListener("gwc-export-ready", this.handleReady);
                this.mount();
            }

            disconnectedCallback() {
                window.removeEventListener("gwc-export-ready", this.handleReady);
                if (typeof window.__gwcUnmountStatusTile === "function") {
                    window.__gwcUnmountStatusTile(this.root);
                }
            }

            attributeChangedCallback() {
                this.mount();
            }

            mount() {
                if (typeof window.__gwcMountStatusTile !== "function") {
                    return;
                }
                window.__gwcMountStatusTile(this.root, {
                    title: this.getAttribute("title") || "",
                    tone: this.getAttribute("tone") || "",
                    detail: this.getAttribute("detail") || "",
                });
            }
        }

        if (!customElements.get("gwc-status-tile")) {
            customElements.define("gwc-status-tile", GWCStatusTile);
        }

        window.addEventListener("DOMContentLoaded", () => {
            const host = document.getElementById("raw-host");
            document.getElementById("set-warning")?.addEventListener("click", () => {
                host?.setAttribute("tone", "warning");
                host?.setAttribute("title", "Carrier queue slipping");
                host?.setAttribute("detail", "A plain HTML button changed observed attributes and the Go-rendered shadow widget re-mounted.");
            });
            document.getElementById("set-critical")?.addEventListener("click", () => {
                host?.setAttribute("tone", "critical");
                host?.setAttribute("title", "Incident response active");
                host?.setAttribute("detail", "Exported GoWebComponents content is now being consumed by a standards-based custom-element host.");
            });
            document.getElementById("set-calm")?.addEventListener("click", () => {
                host?.setAttribute("tone", "neutral");
                host?.setAttribute("title", "Orders synced");
                host?.setAttribute("detail", "The host stays plain HTML; the shadow-root content comes from Go.");
            });
        });
    </script>
</head>
<body class="bg-[#08111d] text-white min-h-screen example-shell">
    <div id="app"></div>
    <section class="host-lab">
        <div class="host-shell">
            <p class="text-xs uppercase tracking-[0.24em] text-cyan-300">Plain HTML hosts</p>
            <h2 class="mt-3 text-3xl font-black text-white">The widgets below are not mounted through `#app`.</h2>
            <p class="mt-4 max-w-3xl text-base leading-7 text-slate-300">Each `<gwc-status-tile>` instance is regular HTML that asks the Go runtime to render into its shadow root. The buttons mutate attributes from plain JS to show the current export-side contract.</p>
            <div class="host-grid">
                <gwc-status-tile id="raw-host" title="Orders synced" tone="neutral" detail="The host stays plain HTML; the shadow-root content comes from Go."></gwc-status-tile>
                <gwc-status-tile title="Warehouse trend healthy" tone="warning" detail="A second host proves the exported widget can be mounted more than once."></gwc-status-tile>
            </div>
            <div class="lab-controls">
                <button id="set-calm" type="button">Neutral state</button>
                <button id="set-warning" type="button">Warning state</button>
                <button id="set-critical" type="button">Critical state</button>
            </div>
        </div>
    </section>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../static/bin/exported-custom-element.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
