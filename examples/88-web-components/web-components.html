<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Components - GoWebComponents</title>
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <link rel="stylesheet" href="../static/css/example-shell.css">
    <script src="../static/script/wasm_exec.js"></script>
    <script src="../static/script/example-logger.js"></script>
    <script type="module">
        class DemoRatingCard extends HTMLElement {
            static observedAttributes = ["palette"];

            constructor() {
                super();
                this._score = 3;
                this._config = {};
                this.attachShadow({ mode: "open" });
                this.handleAdvance = this.handleAdvance.bind(this);
            }

            connectedCallback() {
                this.render();
            }

            attributeChangedCallback() {
                this.render();
            }

            set score(value) {
                const parsed = Number(value);
                if (Number.isNaN(parsed)) {
                    return;
                }
                this._score = parsed;
                this.render();
            }

            get score() {
                return this._score;
            }

            set config(value) {
                this._config = value || {};
                this.render();
            }

            get palette() {
                return this.getAttribute("palette") || "ocean";
            }

            handleAdvance() {
                const next = this._score >= 5 ? 1 : this._score + 1;
                this._score = next;
                this.render();
                this.dispatchEvent(new CustomEvent("rating-change", {
                    bubbles: true,
                    detail: {
                        score: next,
                        source: "demo-rating-card",
                        palette: this.palette,
                    },
                }));
            }

            render() {
                const accent = this.palette === "sunset" ? "#fb923c" : "#67e8f9";
                const headline = this._config.headline || "Untitled widget";
                const caption = this._config.caption || "";
                this.shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: block;
                            border-radius: 28px;
                            border: 1px solid rgba(148, 163, 184, 0.18);
                            background:
                                radial-gradient(circle at top right, ${accent}22, transparent 30%),
                                linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.72));
                            box-shadow: 0 18px 36px rgba(2, 6, 23, 0.32);
                            color: #e2e8f0;
                        }
                        .frame {
                            padding: 24px;
                        }
                        .eyebrow {
                            font-size: 11px;
                            letter-spacing: 0.24em;
                            text-transform: uppercase;
                            color: ${accent};
                        }
                        h2 {
                            margin: 12px 0 0;
                            font-size: 28px;
                            line-height: 1.1;
                            color: white;
                        }
                        p {
                            margin: 12px 0 0;
                            color: #94a3b8;
                            line-height: 1.7;
                        }
                        .meter {
                            display: flex;
                            gap: 10px;
                            margin-top: 20px;
                        }
                        .dot {
                            flex: 1;
                            height: 12px;
                            border-radius: 999px;
                            background: rgba(148, 163, 184, 0.18);
                        }
                        .dot.active {
                            background: ${accent};
                            box-shadow: 0 0 0 1px ${accent}55;
                        }
                        .footer {
                            display: flex;
                            flex-wrap: wrap;
                            justify-content: space-between;
                            gap: 12px;
                            align-items: center;
                            margin-top: 20px;
                        }
                        button {
                            border: 1px solid ${accent}55;
                            background: ${accent}22;
                            color: white;
                            border-radius: 999px;
                            padding: 10px 16px;
                            font-weight: 700;
                            cursor: pointer;
                        }
                        .actions::slotted(*) {
                            display: inline-flex;
                        }
                    </style>
                    <div class="frame">
                        <div class="eyebrow">Browser-defined custom element</div>
                        <h2>${headline}</h2>
                        <p>${caption}</p>
                        <div class="meter">
                            ${Array.from({ length: 5 }, (_, index) => `<div class="dot ${index < this._score ? "active" : ""}"></div>`).join("")}
                        </div>
                        <slot name="summary"></slot>
                        <div class="footer">
                            <button type="button" data-advance>Advance In Widget</button>
                            <div class="actions"><slot name="actions"></slot></div>
                        </div>
                    </div>
                `;
                this.shadowRoot.querySelector("[data-advance]")?.addEventListener("click", this.handleAdvance);
            }
        }

        if (!customElements.get("demo-rating-card")) {
            customElements.define("demo-rating-card", DemoRatingCard);
        }
    </script>
</head>
<body class="bg-[#08111d] text-white min-h-screen example-shell">
    <div id="app"></div>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../static/bin/web-components.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
