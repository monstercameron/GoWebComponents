<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Counter Example</title>
    <link rel="stylesheet" href="../../../static/css/tailwind.css">
    <link rel="stylesheet" href="../../../static/css/example-shell.css">
    <script src="../../../static/script/wasm_exec.js"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            background: #08111d;
            overflow: hidden;
            overflow: clip;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            color: white;
            overflow: hidden;
            overflow: clip;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        #demo-root {
            width: 100%;
            overflow: hidden;
            overflow: clip;
        }

        #demo-root[data-boot="pending"] {
            visibility: hidden;
        }

        #demo-shell {
            position: relative;
            width: 100%;
            min-height: 420px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            overflow: hidden;
            overflow: clip;
        }

        #embed-boot-shell {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background:
                radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.10), transparent 22%),
                linear-gradient(180deg, #08111d 0%, #0b1523 100%);
            transition: opacity 220ms ease;
            z-index: 10;
        }

        #embed-boot-shell[data-state="ready"] {
            opacity: 0;
            pointer-events: none;
        }

        #embed-boot-card {
            width: min(100%, 34rem);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            padding: 1.25rem;
        }

        #embed-progress-track {
            width: 100%;
            height: 0.75rem;
            border-radius: 9999px;
            overflow: hidden;
            background: rgba(148, 163, 184, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #embed-progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.92), rgba(16, 185, 129, 0.95));
            transition: width 120ms linear;
        }

        #embed-boot-shell[data-indeterminate="true"] #embed-progress-bar {
            width: 35%;
            animation: embed-progress-indeterminate 1.1s ease-in-out infinite;
        }

        @keyframes embed-progress-indeterminate {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }

        #embed-error-box {
            display: none;
        }

        #embed-boot-shell[data-state="error"] #embed-error-box {
            display: block;
        }

        #embed-boot-shell[data-state="error"] #embed-progress-track {
            display: none;
        }
    </style>
</head>
<body>
    <div id="demo-shell">
        <div id="embed-boot-shell" data-state="loading" data-indeterminate="true" aria-live="polite">
            <div id="embed-boot-card">
                <div class="text-[11px] uppercase tracking-[0.18em] text-cyan-200">Embedded example</div>
                <h1 class="mt-3 text-2xl font-semibold tracking-tight text-white">Loading counter demo</h1>
                <p id="embed-boot-status" class="mt-3 text-sm leading-7 text-slate-300">Preparing WebAssembly runtime...</p>
                <div class="mt-5 flex items-center justify-between gap-3 text-[11px] uppercase tracking-[0.18em] text-slate-400">
                    <span id="embed-boot-phase">Starting</span>
                    <span id="embed-boot-percent">0%</span>
                </div>
                <div id="embed-progress-track" class="mt-3">
                    <div id="embed-progress-bar"></div>
                </div>
                <div id="embed-error-box" class="mt-5 rounded-2xl border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm leading-6 text-rose-100"></div>
            </div>
        </div>
        <div id="demo-root" data-boot="pending"></div>
    </div>
    <script>
        (async function runEmbeddedCounter() {
            const params = new URLSearchParams(window.location.search);
            const pageVersion = params.get('v');
            const wasmURL = pageVersion
                ? '../bins/01-counter.wasm?v=' + encodeURIComponent(pageVersion)
                : '../bins/01-counter.wasm';
            const shell = document.getElementById('embed-boot-shell');
            const root = document.getElementById('demo-root');
            const statusNode = document.getElementById('embed-boot-status');
            const percentNode = document.getElementById('embed-boot-percent');
            const phaseNode = document.getElementById('embed-boot-phase');
            const progressBar = document.getElementById('embed-progress-bar');
            const errorBox = document.getElementById('embed-error-box');
            const minimumVisibleMs = 1000;
            const bootStartedAt = performance.now();
            let resizeObserver = null;
            let resizeFrame = 0;
            let lastAppliedHeight = 0;

            window.__gwcExampleMountSelector = '#demo-root';

            function syncFrameHeight() {
                const frame = window.frameElement;
                if (!frame) {
                    return;
                }
                const content = root.firstElementChild;
                const contentHeight = content
                    ? Math.ceil(content.getBoundingClientRect().height)
                    : 0;
                const measuredHeight = Math.max(
                    contentHeight,
                    root.scrollHeight,
                    420
                );
                const nextHeight = Math.ceil(measuredHeight) + 8;
                if (nextHeight === lastAppliedHeight) {
                    return;
                }
                lastAppliedHeight = nextHeight;
                frame.style.height = nextHeight + 'px';
            }

            function scheduleFrameHeightSync() {
                if (resizeFrame !== 0) {
                    return;
                }
                resizeFrame = window.requestAnimationFrame(() => {
                    resizeFrame = 0;
                    syncFrameHeight();
                });
            }

            function startHeightSync() {
                scheduleFrameHeightSync();
                if (typeof ResizeObserver === 'function') {
                    resizeObserver = new ResizeObserver(() => scheduleFrameHeightSync());
                    resizeObserver.observe(root);
                    return;
                }
                window.setTimeout(scheduleFrameHeightSync, 0);
                window.setTimeout(scheduleFrameHeightSync, 120);
                window.setTimeout(scheduleFrameHeightSync, 400);
            }

            function setProgress(percent, options) {
                const resolved = options || {};
                const clamped = Math.max(0, Math.min(100, Math.round(percent)));
                shell.dataset.indeterminate = resolved.indeterminate ? 'true' : 'false';
                progressBar.style.width = clamped + '%';
                percentNode.textContent = resolved.indeterminate ? '...' : clamped + '%';
                if (resolved.phase) {
                    phaseNode.textContent = resolved.phase;
                }
                if (resolved.message) {
                    statusNode.textContent = resolved.message;
                }
            }

            function setError(title, detail) {
                shell.dataset.state = 'error';
                shell.dataset.indeterminate = 'false';
                progressBar.style.width = '100%';
                phaseNode.textContent = title;
                percentNode.textContent = 'Failed';
                statusNode.textContent = detail;
                errorBox.textContent = detail;
            }

            function ensureCompatibility() {
                if (typeof WebAssembly === 'undefined') {
                    throw new Error('WebAssembly is not available in this browser.');
                }
                if (typeof Go === 'undefined') {
                    throw new Error('The Go WebAssembly runtime script did not load.');
                }
                if (typeof fetch !== 'function') {
                    throw new Error('Fetch is not available in this browser.');
                }
            }

            async function fetchWasmWithProgress(url) {
                setProgress(5, {
                    indeterminate: true,
                    phase: 'Connecting',
                    message: 'Requesting the WebAssembly binary...'
                });

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('The embedded wasm binary could not be fetched (' + response.status + ' ' + response.statusText + ').');
                }

                const contentLengthHeader = response.headers.get('content-length');
                const totalBytes = contentLengthHeader ? Number(contentLengthHeader) : 0;
                if (!response.body || typeof response.body.getReader !== 'function') {
                    setProgress(50, {
                        indeterminate: true,
                        phase: 'Downloading',
                        message: 'Downloading WebAssembly binary...'
                    });
                    return new Uint8Array(await response.arrayBuffer());
                }

                const reader = response.body.getReader();
                const chunks = [];
                let receivedBytes = 0;
                while (true) {
                    const result = await reader.read();
                    if (result.done) {
                        break;
                    }
                    chunks.push(result.value);
                    receivedBytes += result.value.length;
                    if (totalBytes > 0) {
                        const progress = 10 + ((receivedBytes / totalBytes) * 70);
                        setProgress(progress, {
                            indeterminate: false,
                            phase: 'Downloading',
                            message: 'Downloading WebAssembly binary...'
                        });
                    } else {
                        setProgress(50, {
                            indeterminate: true,
                            phase: 'Downloading',
                            message: 'Downloading WebAssembly binary...'
                        });
                    }
                }

                const bytes = new Uint8Array(receivedBytes);
                let offset = 0;
                for (const chunk of chunks) {
                    bytes.set(chunk, offset);
                    offset += chunk.length;
                }
                return bytes;
            }

            async function enforceMinimumVisibleTime() {
                const elapsed = performance.now() - bootStartedAt;
                const remaining = minimumVisibleMs - elapsed;
                if (remaining > 0) {
                    await new Promise((resolve) => setTimeout(resolve, remaining));
                }
            }

            try {
                ensureCompatibility();
                const go = new Go();
                const bytes = await fetchWasmWithProgress(wasmURL);
                setProgress(88, {
                    indeterminate: false,
                    phase: 'Compiling',
                    message: 'Compiling and instantiating WebAssembly...'
                });
                const result = await WebAssembly.instantiate(bytes, go.importObject);

                setProgress(100, {
                    indeterminate: false,
                    phase: 'Starting',
                    message: 'Starting embedded counter demo...'
                });

                await enforceMinimumVisibleTime();
                root.dataset.boot = 'ready';
                shell.dataset.state = 'ready';
                startHeightSync();
                scheduleFrameHeightSync();
                window.setTimeout(scheduleFrameHeightSync, 60);
                window.setTimeout(scheduleFrameHeightSync, 180);
                go.run(result.instance);
            } catch (error) {
                const detail = error instanceof Error ? error.message : String(error);
                setError('Load failed', detail);
                scheduleFrameHeightSync();
            }
        })();
    </script>
</body>
</html>
