<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Routes - GoWebComponents</title>
    <link rel="stylesheet" href="../static/css/tailwind.css">
    <script src="../static/script/wasm_exec.js"></script>
</head>
<body class="min-h-screen bg-[#f4efe4] text-[#1f2520]">
    <div id="app"></div>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../static/bin/nested-routes.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
