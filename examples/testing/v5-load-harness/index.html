<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWC v6 Load Harness</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.55 system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { opacity: .7; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; }
  #app { border: 1px solid rgba(128,128,128,.35); border-radius: 6px; padding: 12px; margin-top: 12px; }
  #rows { height: 320px; overflow-y: auto; margin: 8px 0 0; padding-left: 20px; }
  #out { white-space: pre; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
         border: 1px solid rgba(128,128,128,.35); border-radius: 6px; padding: 12px;
         margin-top: 16px; overflow-x: auto; min-height: 60px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/wasm_exec.js"></script>
  <script type="module">
    import { runDashboardComparison } from './dashboard.js';
    globalThis.__gwcRunDashboardComparison = () => runDashboardComparison();
    const parseGo = new Go();
    const parseResult = await WebAssembly.instantiateStreaming(fetch('./v5harness.wasm'), parseGo.importObject);
    await parseGo.run(parseResult.instance);
  </script>
</body>
</html>
