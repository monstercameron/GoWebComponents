<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ui.RenderToString - GoWebComponents</title>
    <script src="../static/script/wasm_exec.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch('../static/bin/render-to-string.wasm'), go.importObject)
            .then(result => go.run(result.instance))
            .catch(err => console.error('Failed to load WASM:', err));
    </script>
</body>
</html>
